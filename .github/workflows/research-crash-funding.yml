# זמני (ops): מחקר 7כב — קנייה בקריסות לפי דמי המימון על BTC/ETH, סבב אחד (scripts/research-crash-funding.mjs). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
name: research-crash-funding
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-crash-funding.yml]
permissions: { contents: write }
concurrency: { group: research-crash-funding, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: xsra-data.json.gz, key: research-xsra-2016-2026-11-13-v1 }
      - name: data (אם המטמון לא זמין)
        run: '[ -f xsra-data.json.gz ] || node invest-api/scripts/research-xs-ra.mjs --data xsra-data.json.gz > /dev/null'
      - name: tests
        run: node --test invest-api/tests/crash-funding.test.mjs invest-api/tests/trend-btceth.test.mjs
      - name: run
        run: |
          mkdir -p invest/docs/research/funding-crash
          node invest-api/scripts/research-crash-funding.mjs --data xsra-data.json.gz --funding invest/docs/research/funding-crash/funding-daily.json --n 1000 --out invest/docs/research/funding-crash/report.md --json invest/docs/research/funding-crash/results.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/funding-crash
          git commit -m "ops: תוצאות מחקר הקנייה בקריסות לפי דמי המימון (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
