# זמני (ops; ריצה 2 — ימים זמינים ודגימות דרך הממשק הציבורי): שער הנתונים של מחקר VRP — בדיקת ספק נתונים בלבד (CryptoStruct, QuantStrix, תיעוד מרג'ין של Deribit).
# שליפת דפים ציבוריים בלבד: בלי רכישה, בלי הרשמה, בלי מפתחות, בלי Backtest. יוסר בסוף הבדיקה.
name: vrp-vendor-check
on:
  push:
    branches: [research/vrp-defined-risk-options]
    paths: [.github/workflows/vrp-vendor-check.yml]
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: probe3
        run: |
          D=invest/docs/research/vrp-options/data_gate
          timeout 900 python3 $D/probe3.py $D/results/samples.json $D/results/probe3_cryptostruct.json || true
          timeout 300 python3 $D/vendor_fetch.py $D/results/vendors https://cryptostruct.com/llms.txt https://cryptostruct.com/docs/api.md https://cryptostruct.com/download https://cryptostruct.com/shop/coverage || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/vrp-options/data_gate/results
          git commit -m "ops(vrp): בדיקת ספקי נתונים — דפים ציבוריים (ריצה ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
