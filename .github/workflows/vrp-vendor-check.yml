# זמני (ops; ריצה 3ב — דגימה חינמית של אופציה (סטטיסטיקה בלבד) וכיסוי יומי של כל רגל): שער הנתונים של מחקר VRP — בדיקת ספק נתונים בלבד (CryptoStruct, QuantStrix, תיעוד מרג'ין של Deribit).
# שליפת דפים ציבוריים בלבד: בלי רכישה, בלי הרשמה, בלי מפתחות, בלי Backtest. יוסר בסוף הבדיקה.
name: vrp-vendor-check
on:
  push:
    branches: [research/vrp-defined-risk-options]
    paths: [.github/workflows/vrp-vendor-check.yml]
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: probe4
        run: |
          D=invest/docs/research/vrp-options/data_gate
          command -v zstd || sudo apt-get install -y zstd
          timeout 1500 python3 $D/probe4.py $D/results/samples.json $D/results/probe4_cryptostruct.json || true
          timeout 120 python3 $D/vendor_fetch.py $D/results/vendors https://cryptostruct.com/skills/cryptostruct-market-data/references/day-file-format.md || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/vrp-options/data_gate/results
          git commit -m "ops(vrp): בדיקת ספקי נתונים — דפים ציבוריים (ריצה ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
