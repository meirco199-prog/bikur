# מחקר "שיטת 2 אחוז" (scripts/research-bracket2.mjs, invest/docs/research/bracket2/). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
# השאלה (מאיר, 12/11/2026): קונים בפתיחה ומוכרים כשהמניה עולה 2% או יורדת 2% — טוב? 5 השנים האחרונות.
# נתונים: Yahoo Finance יומי, הרכב S&P 500 היסטורי (אותו מקור כמו research-xsec).
# הרצה: Actions → research-bracket2 → Run workflow, או דחיפה של .github/bracket2/command לענף שאינו main.
# התוצאות (report.md, meta.json) נשמרות כ-artifact ונדחפות לענף שעליו רץ ה-workflow (לא ל-main).
name: research-bracket2
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/bracket2/command']
permissions: { contents: write }
concurrency: { group: research-bracket2, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/research-bracket2.test.mjs invest-api/tests/research-xsec.test.mjs
      - name: research
        run: node --max-old-space-size=6000 invest-api/scripts/research-bracket2.mjs --outdir invest/docs/research/bracket2
      - uses: actions/upload-artifact@v4
        with: { name: bracket2-results, path: invest/docs/research/bracket2 }
      - name: commit results
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/bracket2
          git commit -m "ops: תוצאות מחקר שיטת 2 אחוז (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
