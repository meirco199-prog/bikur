# ערוץ הכתיבה של ChatGPT ל-AI Council, לכל הפרויקטים: ChatGPT שולח ל-Worker (POST /council/comment עם project), ההודעה נכנסת
# לתיבת דואר ב-KV, וכאן — עם ה-GITHUB_TOKEN המובנה (issues: write) — היא מנותבת ל-Issue של הפרויקט (invest → #25 כמו תמיד;
# food/english/… לפי .github/council/projects.json, עם פתיחת Issue אוטומטית לפרויקט חדש). בלי PAT ובלי סוד נוסף (רק CRON_SECRET).
# גם מסנכרן את הסטטוסים שClaude מסמן בתגובות בחזרה ל-Worker (GET /council/tasks). ראה .github/council/README.md
name: AI Council relay (ChatGPT → project Issues)

on:
  schedule:
    - cron: '*/20 * * * *'   # GitHub לפעמים מאחר בתזמונים; אפשר גם להפעיל ידנית
  workflow_dispatch:
    inputs:
      e2e_project:
        description: 'בדיקת קצה-לקצה: שלח הודעת בדיקה דרך ה-Worker לפרויקט הזה (food / english / …) ונתב אותה'
        required: false
        default: ''
      e2e_title:
        description: 'כותרת להודעת הבדיקה (אופציונלי)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency: council-relay

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Route council inbox → project Issues, sync task statuses
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET: ${{ secrets.CRON_SECRET }}
          WORKER_URL: https://invest-api.meirco199.workers.dev
          REPO: ${{ github.repository }}
          E2E_PROJECT: ${{ github.event.inputs.e2e_project }}
          E2E_TITLE: ${{ github.event.inputs.e2e_title }}
        run: node .github/council/relay.mjs
