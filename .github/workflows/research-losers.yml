# זמני (ops): קנייה בפתיחה + סטופ ±500$ לכל התיק, חצי השנה האחרונה (scripts/research-losers-open.mjs). מחקר בלבד.
name: research-losers
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-losers.yml]
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: open
        run: node invest-api/scripts/research-losers-open.mjs --cache losers-open.json --out research-losers-open.md
