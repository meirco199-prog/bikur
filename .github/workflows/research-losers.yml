# זמני (ops): תנופת בוקר — בדיקת מרווחים ועלויות על ההיסטוריה (scripts/research-losers-spread.mjs). מחקר בלבד.
name: research-losers
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-losers.yml]
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: spread
        run: node invest-api/scripts/research-losers-spread.mjs --out research-losers-spread.md
