# שעון גיבוי לבוט: השעון של Cloudflare בתוכנית החינמית מדלג לפעמים —
# GitHub מעיר את הבוט כל ~5 דקות דרך /tick, כך שתזכורות לא מאחרות שעות.
# ההשהיה האקראית מפזרת את הקריאה בתוך הדקה כדי לא להתנגש בשעון הראשי.

name: Tick remi (backup clock)

on:
  schedule:
    # דקות "עקומות" בכוונה — בדקות העגולות התור של GitHub הכי עמוס,
    # וריצות מתוזמנות נתקעות שם בלי שרת ומתבטלות
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the worker
        run: |
          sleep $((RANDOM % 20 + 25))
          resp=$(curl -sS --max-time 45 "https://remi.meirco199.workers.dev/tick?secret=remi-meir-2026")
          echo "$resp"
          echo "$resp" | grep -q 'tick ok'

      # תמונת מצב טכנית ליומן הריצה — שעות, מזהים ושגיאות בלבד, בלי שום תוכן אישי
      - name: Health snapshot
        run: |
          curl -sS --max-time 30 "https://remi.meirco199.workers.dev/health?secret=remi-meir-2026" || true
