# זמני (ops): הרצת טורניר 30 הגרסאות על 60 ימים של נרות דקה מ-Coinbase (ציבורי). מחקר בלבד — אין פקודות ואין מפתחות.
name: tournament-run
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/tournament-run.yml]
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node invest-api/scripts/tournament-backtest.mjs --days 60 --json tournament.json | tee tournament.md
      - uses: actions/upload-artifact@v4
        with: { name: tournament, path: 'tournament.*' }
