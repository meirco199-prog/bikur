# מנוע העיבוד היומי של פלטפורמת ההשקעות מ-GitHub — עובד גם בתוכנית Workers החינמית:
# כל קריאה ל-/cron/run היא הפעלה נפרדת של ה-Worker (מגבלת CPU לכל הפעלה), והלולאה ממשיכה עד "finalized".
# רץ אחרי סגירת וול סטריט ואחרי איפוס מכסת הכתיבות של KV (00:00 UTC), וגם בכל דחיפה של פקודה לקובץ .github/invest-ops/command.
name: Tick invest (daily processing)

on:
  schedule:
    - cron: '17 1 * * 2-6'
    - cron: '47 3 * * 2-6'
    - cron: '50 14 * * 1-5'   # גיבוי לביצוע האוטומט בשעות המסחר בניו יורק (10:50 EDT / 09:50 EST)
  push:
    branches: [main]
    paths:
      - '.github/invest-ops/command'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          W=https://invest-api.meirco199.workers.dev
          SECRET=$(python3 -c 'import json; print(json.load(open("invest-api/config.json"))["CRON_SECRET"])')
          BATCH=$(python3 -c 'import json; print(json.load(open("invest-api/config.json")).get("CRON_BATCH","2"))')
          CMD=$(cat .github/invest-ops/command 2>/dev/null | head -1 | cut -d" " -f1 || echo cron-run)
          [ "${{ github.event_name }}" = "push" ] && { echo "ממתין לפריסת ה-Worker…"; sleep 75; }
          [ "${{ github.event_name }}" = "push" ] || CMD=cron-run
          echo "command: $CMD"
          echo "=== health"; curl -sS --max-time 30 "$W/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("auth:", d.get("auth"), "kv:", d.get("kv"), "kvWriteLimitHit:", d.get("kvWriteLimitHit"), "ai:", d.get("ai")); print("keys:", [k["name"] for k in d.get("keys",[]) if k.get("set")]); print("budget:", d.get("budget")); print("cron:", d.get("cron")); print("recentErrors:"); [print("  ", e.get("ts","")[5:16], e.get("where"), "|", e.get("msg")) for e in d.get("recentErrors",[])]'
          TODAY=$(date -u +%F)
          echo "=== snapshot AAPL"; curl -sS --max-time 30 "$W/snapshot/$TODAY/AAPL" | head -c 700; echo
          echo "=== paper"; curl -sS --max-time 30 "$W/paper" | head -c 900; echo
          echo "=== quote AAPL"; curl -sS --max-time 30 "$W/asset/AAPL" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("price:", d.get("price"), d.get("priceSource"), "signal:", (d.get("signal") or {}).get("label"), "score:", (d.get("score") or {}).get("total"))'
          echo "=== prices SPY"; curl -sS --max-time 60 "$W/prices/SPY?from=2026-09-01" | head -c 600; echo
          echo "=== facts AAPL (EDGAR)"; curl -sS --max-time 60 "$W/bundle/AAPL?light=0" | python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("facts",{}); print("facts:", f.get("source"), f.get("asOf"), "series:", {k: len(v) for k,v in (f.get("series") or {}).items()} if not f.get("missing") else f.get("reason")); print("prices:", d.get("prices",{}).get("source"), d.get("prices",{}).get("asOf"), d.get("prices",{}).get("reason"))'
          FORCE=""; [ "$CMD" = "cron-run-force" ] && { CMD=cron-run; FORCE="&force=1"; }
          if [ "$CMD" = "cron-run" ]; then
            echo "=== cron-run (batch $BATCH)"
            for i in $(seq 1 120); do
              r=$(curl -sS --max-time 60 -X POST "$W/cron/run?batch=$BATCH&secret=$SECRET$FORCE" || echo '{"error":"curl failed"}')
              echo "$i: $(echo "$r" | head -c 400)"
              echo "$r" | grep -q '"finalized":true' && break
              echo "$r" | grep -q 'error' && sleep 3
              sleep 16
            done
          fi
          if [ "$CMD" = "auto-run" ] || [ "$CMD" = "cron-run" ]; then
            echo "=== autopilot"; curl -sS --max-time 120 -X POST "$W/auto/run?secret=$SECRET&trigger=github" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ran:", d.get("ran"), d.get("reason",""), "day:", d.get("day")); print("regime:", (d.get("regime") or {}).get("summary")); print("before:", d.get("before"), "after:", d.get("after")); [print("  ", o["side"], o["qty"], "x", o["symbol"], o.get("name"), "@", o.get("price"), "ok" if o.get("ok") else "ERR " + str(o.get("error")), "|", o.get("reason")) for o in d.get("orders",[])]; print("notes:", d.get("notes")); [print("  skip", s["symbol"], "|", s["reason"]) for s in d.get("skipped",[])]'
          fi
          echo "=== auto status (last run)"; curl -sS --max-time 30 "$W/auto/status" | python3 -c 'import json,sys; d=json.load(sys.stdin); l=d.get("last") or {}; print("enabled:", d.get("enabled"), "profile:", d.get("profile"), "runs:", len(d.get("journal",[]))); print("last:", l.get("ts"), l.get("day"), l.get("trigger"), "rules v", l.get("rulesVersion")); print("regime:", (l.get("regime") or {}).get("summary")); print("before:", l.get("before"), "after:", l.get("after")); [print("  ", o["side"], o["qty"], "x", o["symbol"], o.get("name"), "@", o.get("price"), "ok" if o.get("ok") else "ERR " + str(o.get("error")), "|", o.get("reason")) for o in l.get("orders",[])]; print("notes:", l.get("notes")); [print("  skip", s["symbol"], "|", s["reason"]) for s in l.get("skipped",[])]'
          echo "=== cron status"; curl -sS --max-time 30 "$W/cron/status" | head -c 1500; echo
          echo "=== rank"; curl -sS --max-time 30 "$W/rank" | head -c 500; echo
