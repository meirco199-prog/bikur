# מנוע העיבוד היומי של פלטפורמת ההשקעות מ-GitHub — עובד גם בתוכנית Workers החינמית:
# כל קריאה ל-/cron/run היא הפעלה נפרדת של ה-Worker (מגבלת CPU לכל הפעלה), והלולאה ממשיכה עד "finalized".
# רץ אחרי סגירת וול סטריט, וגם בכל דחיפה של פקודה לקובץ .github/invest-ops/command (health / cron-run).
name: Tick invest (daily processing)

on:
  schedule:
    - cron: '17 22 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/invest-ops/command'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          W=https://invest-api.meirco199.workers.dev
          SECRET=$(python3 -c 'import json; print(json.load(open("invest-api/config.json"))["CRON_SECRET"])')
          BATCH=$(python3 -c 'import json; print(json.load(open("invest-api/config.json")).get("CRON_BATCH","2"))')
          CMD=$(cat .github/invest-ops/command 2>/dev/null | head -1 || echo cron-run)
          [ "${{ github.event_name }}" = "push" ] && { echo "ממתין לפריסת ה-Worker…"; sleep 75; }
          [ "${{ github.event_name }}" = "push" ] || CMD=cron-run
          echo "command: $CMD"
          echo "=== health"; curl -sS --max-time 30 "$W/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("auth:", d.get("auth"), "kv:", d.get("kv"), "ai:", d.get("ai")); print("keys:", [k["name"] for k in d.get("keys",[]) if k.get("set")]); print("budget:", d.get("budget")); print("cron:", d.get("cron")); print("recentErrors:"); [print("  ", e.get("ts","")[5:16], e.get("where"), "|", e.get("msg")) for e in d.get("recentErrors",[])]'
          TODAY=$(date -u +%F)
          echo "=== snapshot AAPL"; curl -sS --max-time 30 "$W/snapshot/$TODAY/AAPL" | head -c 700; echo
          echo "=== prices SPY"; curl -sS --max-time 60 "$W/prices/SPY?from=2026-09-01" | head -c 600; echo
          echo "=== stooq from GitHub runner?"
          probe=$(curl -sS --max-time 20 -A "Mozilla/5.0 (bikur-invest)" "https://stooq.com/q/d/l/?s=spy.us&i=d" | head -c 200 | tr '\n' ' ')
          echo "$probe"
          echo "=== facts AAPL (EDGAR)"; curl -sS --max-time 60 "$W/bundle/AAPL?light=0" | python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("facts",{}); print("facts:", f.get("source"), f.get("asOf"), "series:", {k: len(v) for k,v in (f.get("series") or {}).items()} if not f.get("missing") else f.get("reason")); print("prices:", d.get("prices",{}).get("source"), d.get("prices",{}).get("asOf"), d.get("prices",{}).get("reason"))'
          if echo "$probe" | grep -q "^Date,Open"; then
            echo "=== ingest-stooq: Stooq עונה מ-GitHub — מושך CSV לכל ה-universe ומזרים ל-Worker"
            python3 - "$W" "$SECRET" <<'PY'
          import json, sys, time, urllib.request, urllib.parse
          W, SECRET = sys.argv[1], sys.argv[2]
          u = json.load(urllib.request.urlopen(W + "/universe", timeout=60))
          syms = [(a["symbol"], a.get("stooq") or (a["symbol"].lower().replace(".", "-") + ".us"), a.get("currency", "USD")) for a in u["items"]]
          syms += [(ix["symbol"], ix["stooq"], ix.get("currency", "USD")) for ix in u.get("indices", []) if ix.get("stooq")]
          batch, ok, bad = [], 0, []
          def flush():
              global batch, ok
              if not batch: return
              req = urllib.request.Request(W + "/ingest/prices?secret=" + urllib.parse.quote(SECRET), data=json.dumps({"items": batch}).encode(), headers={"Content-Type": "application/json"}, method="POST")
              r = json.load(urllib.request.urlopen(req, timeout=120)); ok += sum(1 for x in r["items"] if "rows" in x); batch = []
          for sym, st, cur in syms:
              try:
                  req = urllib.request.Request("https://stooq.com/q/d/l/?s=" + st + "&i=d", headers={"User-Agent": "Mozilla/5.0 (bikur-invest)"})
                  csv = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
                  if csv.startswith("Date,Open"): batch.append({"symbol": sym, "csv": csv, "currency": cur, "source": "stooq-via-github"})
                  else: bad.append(sym + ":" + csv[:40].replace("\n", " "))
              except Exception as e: bad.append(sym + ":" + str(e)[:40])
              if len(batch) >= 10: flush()
              time.sleep(0.7)
          flush()
          print("ingested:", ok, "of", len(syms), "bad:", bad[:8])
          PY
          fi
          if [ "$CMD" = "cron-run" ]; then
            echo "=== cron-run (batch $BATCH)"
            for i in $(seq 1 150); do
              r=$(curl -sS --max-time 90 -X POST "$W/cron/run?batch=$BATCH&secret=$SECRET" || echo '{"error":"curl failed"}')
              echo "$i: $(echo "$r" | head -c 400)"
              echo "$r" | grep -q '"finalized":true' && break
              echo "$r" | grep -q 'error' && sleep 3
            done
          fi
          echo "=== cron status"; curl -sS --max-time 30 "$W/cron/status" | head -c 1500; echo
          echo "=== rank"; curl -sS --max-time 30 "$W/rank" | head -c 500; echo
