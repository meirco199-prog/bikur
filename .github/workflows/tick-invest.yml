# מנוע העיבוד היומי של פלטפורמת ההשקעות מ-GitHub — עובד גם בתוכנית Workers החינמית:
# כל קריאה ל-/cron/run היא הפעלה נפרדת של ה-Worker (מגבלת CPU לכל הפעלה), והלולאה ממשיכה עד "finalized".
# רץ אחרי סגירת וול סטריט ואחרי איפוס מכסת הכתיבות של KV (00:00 UTC), וגם בכל דחיפה של פקודה לקובץ .github/invest-ops/command.
name: Tick invest (daily processing)

on:
  schedule:
    # GitHub מריץ תזמונים בריפו הזה באיחור של כמה שעות (בפועל ~06:00 ו-~08:50 UTC במקום 01:17/03:47), לכן: כמה חלונות,
    # וכל שלב בודק בעצמו אם העבודה של היום כבר נעשתה (הסריקה הלילית לפי הדירוג, מחירי 09:40 לפי GET /entry/{day})
    - cron: '17 1 * * 2-6'
    - cron: '47 3 * * 2-6'
    - cron: '30 5 * * 2-6'
    - cron: '50 14 * * 1-5'   # גיבוי לביצוע האוטומט בשעות המסחר בניו יורק (10:50 EDT / 09:50 EST)
    - cron: '20 16 * * 1-5'   # מחירי 09:40 של היום (גם אם GitHub מאחר) + גיבוי נוסף לביצוע
  push:
    branches: [main]
    paths:
      - '.github/invest-ops/command'
  workflow_dispatch:

# issues: write — פרסום דוח התקינות היומי כתגובה ב-Issue הקבוע של AI Council (#25). אין הרשאת כתיבה לקוד
permissions:
  contents: read
  issues: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache S&P 500 data (prices, EDGAR facts)
        uses: actions/cache@v4
        with:
          path: .cache/sp500
          key: sp500-data-v1-${{ github.run_id }}
          restore-keys: |
            sp500-data-v1-
      - name: Run
        run: |
          W=https://invest-api.meirco199.workers.dev
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then echo "::error::חסר הסוד CRON_SECRET בהגדרות הריפו (Settings → Secrets and variables → Actions) — ראה invest/docs/SECURITY.md"; exit 1; fi
          BATCH=$(python3 -c 'import json; print(json.load(open("invest-api/config.json")).get("CRON_BATCH","2"))')
          CMD=$(cat .github/invest-ops/command 2>/dev/null | head -1 | cut -d" " -f1 || echo cron-run)
          # הסוכן האוטונומי (סימולציית IBKR): תמחור בבאצ'ים (מכסת Twelve Data ~7/דקה) ואז החלטה; קריאה חוזרת ממשיכה מאותה נקודה
          agent_loop(){ EXTRA="$1"; for i in $(seq 1 14); do r=$(curl -sS --max-time 120 -X POST "$W/agent/run?secret=$SECRET&batch=6$EXTRA" || echo '{"error":"curl failed"}'); echo "$i: $(echo "$r" | head -c 900)"; EXTRA=""; echo "$r" | grep -q '"phase":"pricing"' || break; sleep 50; done; }
          [ "${{ github.event_name }}" = "push" ] && { echo "ממתין לפריסת ה-Worker…"; sleep 75; }
          [ "${{ github.event_name }}" = "push" ] || CMD=cron-run
          echo "command: $CMD"
          echo "=== health"; curl -sS --max-time 30 "$W/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("auth:", d.get("auth"), "kv:", d.get("kv"), "kvWriteLimitHit:", d.get("kvWriteLimitHit"), "ai:", d.get("ai")); print("keys:", [k["name"] for k in d.get("keys",[]) if k.get("set")]); print("budget:", d.get("budget")); print("cron:", d.get("cron")); print("recentErrors:"); [print("  ", e.get("ts","")[5:16], e.get("where"), "|", e.get("msg")) for e in d.get("recentErrors",[])]'
          TODAY=$(date -u +%F)
          echo "=== snapshot AAPL"; curl -sS --max-time 30 "$W/snapshot/$TODAY/AAPL" | head -c 700; echo
          echo "=== paper"; curl -sS --max-time 30 "$W/paper" | head -c 900; echo
          echo "=== quote AAPL"; curl -sS --max-time 30 "$W/asset/AAPL" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("price:", d.get("price"), d.get("priceSource"), "signal:", (d.get("signal") or {}).get("label"), "score:", (d.get("score") or {}).get("total"))'
          echo "=== prices SPY"; curl -sS --max-time 60 "$W/prices/SPY?from=2026-09-01" | head -c 600; echo
          echo "=== facts AAPL (EDGAR)"; curl -sS --max-time 60 "$W/bundle/AAPL?light=0" | python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("facts",{}); print("facts:", f.get("source"), f.get("asOf"), "series:", {k: len(v) for k,v in (f.get("series") or {}).items()} if not f.get("missing") else f.get("reason")); print("prices:", d.get("prices",{}).get("source"), d.get("prices",{}).get("asOf"), d.get("prices",{}).get("reason"))'
          # ניתוח לילי של כל ה-S&P 500 כאן (Yahoo + EDGAR, בלי מכסות Worker) → shards ב-KV. בריצה המתוזמנת ובפקודת sp500-run
          # (הסקריפט מדלג אם הדירוג של היום כבר כולל את המדד; רץ בכל ריצה מתוזמנת לפני פתיחת ניו יורק, כי GitHub מאחר בתזמון)
          if [ "$CMD" = "sp500-run" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" -lt 13 ]; }; then
            # EDGAR דורש User-Agent עם איש קשר (אחרת 403) — אותו UA שמוגדר ל-Worker ב-config.json. sp500-run ידני = הרצה מחדש בכוח
            EDGAR_UA_CFG=$(python3 -c 'import json; print(json.load(open("invest-api/config.json")).get("EDGAR_UA",""))')
            FORCE500=""; [ "$CMD" = "sp500-run" ] && FORCE500=1
            rm -f .sp500-ran
            echo "=== sp500 nightly"; CRON_SECRET="$SECRET" WORKER_URL="$W" EDGAR_UA="$EDGAR_UA_CFG" SP500_FORCE="$FORCE500" TWELVEDATA_KEY="${{ secrets.TWELVEDATA_KEY }}" SP500_PRICE_SOURCE="${{ vars.SP500_PRICE_SOURCE }}" SP500_LIMIT="$(cat .github/invest-ops/command 2>/dev/null | cut -d' ' -f3)" node invest-api/scripts/nightly-sp500.mjs || echo "::warning::sp500 nightly failed"
            echo "=== shadow re-run (force)"
            SHADOW_RESP=$(curl -sS --max-time 120 -X POST "$W/shadow/run?secret=$SECRET&force=1")
            echo "$SHADOW_RESP" | head -c 400; echo
            # בדיקת שפיות: אחרי סריקה מלאה מודל הצל אמור לרוץ על היום ועל כיסוי כמעט-מלא (~500); אם לא — התרעה גלויה
            # במקום דיווח הצלחה שקטה (ראה AI_COUNCIL: תיקון "rank לא נוצר כשלא היה קיים ליום הזה")
            echo "$SHADOW_RESP" | TODAY="$TODAY" python3 -c 'import json,os,sys; d=json.load(sys.stdin); day=d.get("day"); uc=d.get("uniformCount",0); t=os.environ["TODAY"]; print(f"::warning::מודל הצל רץ על {day} ולא על היום ({t}) — כנראה שה-rank של היום עדיין לא נוצר") if day!=t else (print(f"::warning::כיסוי מודל הצל נמוך: uniformCount={uc} על יום {day} — פחות מהמצופה לסריקת S&P 500 מלאה") if uc<300 else None)' || true
            # אם הסריקה רצה עכשיו (ולא דילגה) — ההחלטה הלילית של המסלול האגרסיבי מתקבלת מחדש על מודל הצל המעודכן (פקודות שטרם בוצעו מתבטלות)
            FORCEAGG=""; [ -f .sp500-ran ] && FORCEAGG="&force=1"
            echo "=== aggressive decide"; curl -sS --max-time 120 -X POST "$W/aggressive/run?secret=$SECRET$FORCEAGG" | head -c 600; echo
            echo "=== agent (סוכן רב-נכסי, סימולציית IBKR)"; agent_loop ""
          fi
          if [ "$CMD" = "agent-run" ] || [ "$CMD" = "agent-reset" ]; then
            RS="&force=1"; [ "$CMD" = "agent-reset" ] && RS="&reset=1&force=1"
            echo "=== agent ($CMD)"; agent_loop "$RS"
          fi
          FORCE=""; [ "$CMD" = "cron-run-force" ] && { CMD=cron-run; FORCE="&force=1"; }
          if [ "$CMD" = "cron-run" ]; then
            echo "=== cron-run (batch $BATCH)"
            for i in $(seq 1 120); do
              r=$(curl -sS --max-time 60 -X POST "$W/cron/run?batch=$BATCH&secret=$SECRET$FORCE" || echo '{"error":"curl failed"}')
              echo "$i: $(echo "$r" | head -c 400)"
              echo "$r" | grep -q '"finalized":true' && break
              echo "$r" | grep -q 'error' && sleep 3
              sleep 16
            done
          fi
          # בדיקת מסלולי FMP מהרץ של GitHub (הסביבה של הסוכן חסומה לאתר)
          if [ "$CMD" = "fmp-plans" ]; then
            python3 invest-api/scripts/fmp-plans-probe.py | head -700
          fi
          # מחירי 09:40 ניו יורק לסשן האחרון: בכל ריצה מתוזמנת ובפקודות (הסקריפט מדלג אם הסשן כבר נאסף; entry940-run אוסף מחדש)
          if [ "$CMD" = "entry940-run" ] || [ "$CMD" = "sp500-run" ] || [ "$CMD" = "auto-run" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            FORCE940=""; [ "$CMD" = "entry940-run" ] && FORCE940=1
            echo "=== entry940 (הסשן האחרון)"; CRON_SECRET="$SECRET" WORKER_URL="$W" ENTRY_FORCE="$FORCE940" ENTRY_LIMIT="$(cat .github/invest-ops/command 2>/dev/null | cut -d' ' -f3)" node invest-api/scripts/entry940.mjs || echo "::warning::entry940 failed"
          fi
          # אבחון: dump <ts> <path> [<path>...] — מדפיס תשובות JSON מה-Worker (עד 8000 תווים לכל נתיב)
          if [ "$CMD" = "dump" ]; then
            for P in $(cat .github/invest-ops/command 2>/dev/null | cut -d' ' -f3-); do echo "=== dump $P"; curl -sS --max-time 60 "$W/$P" | head -c 8000; echo; done
          fi
          # אבחון: analyst-check <ts> <SYM> [<SYM>...] — שדה analyst (קונצנזוס+טרגטים) ורכיב הציון, לכל סימבול (השדה מגיע מאוחר ב-/asset אז לא נראה ב-dump הרגיל שנחתך ב-8000 תווים)
          if [ "$CMD" = "analyst-check" ]; then
            for S in $(cat .github/invest-ops/command 2>/dev/null | cut -d' ' -f3-); do
              echo "=== analyst-check $S"
              curl -sS --max-time 30 "$W/asset/$S" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("missing:", d.get("missing"), d.get("reason","")) if d.get("missing") else (print("priceSource:", d.get("priceSource")), print("analyst:", d.get("analyst")), print("scoreAnalystComponent:", (d.get("score") or {}).get("components",{}).get("analyst")))'
            done
          fi
          # אבחון: agent-check <ts> — למה הסוכן האוטונומי דחה פקודות (יומן דחיות במילוי + שער ההזדמנויות של הסשן האחרון). קריאה בלבד
          if [ "$CMD" = "agent-check" ]; then
            echo "=== agent-check"; curl -sS --max-time 30 "$W/agent/report" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("day:", d.get("day"), "equity:", d.get("totalIls"), "leverage:", d.get("leverage"), "halted:", d.get("halted")); print("--- journal (last 40)"); [print("  ", j.get("day"), j.get("kind"), j.get("side",""), j.get("qty",""), j.get("symbol",""), j.get("strategy",""), j.get("stage",""), j.get("reasons") or j.get("price") or "") for j in (d.get("journal") or [])[:40]]; o=d.get("opportunities") or {}; print("--- gateLog", o.get("day")); [print("  ", g.get("side"), g.get("symbol"), g.get("strategy"), g.get("score"), g.get("reasons")) for g in (o.get("gateLog") or [])]; print("--- candidates"); [print("  ", c.get("side"), c.get("symbol"), c.get("strategy"), c.get("score"), "stop", c.get("stopPct"), "research" if c.get("needsResearch") else "", "conflict" if c.get("conflict") else "") for c in (o.get("candidates") or [])[:20]]' || echo "::warning::agent-check נכשל"
          fi
          # אבחון: paper-check <ts> — מאיפה מגיע הרווח/הפסד "מההתחלה" בחשבון התרגול (חשבון, פוזיציות, עסקאות, פירוק, יומן אוטומט). קריאה בלבד
          if [ "$CMD" = "paper-check" ]; then
            WORKER_URL="$W" node invest-api/scripts/paper-check.mjs || echo "::warning::paper-check נכשל"
          fi
          # פעולה: paper-rebase <ts> — איפוס נקודת ההתחלה של חשבון התרגול לרווח האוטומט בפועל (רישומים ידניים מלפני האוטומט לא נספרים).
          # לא מוחק עסקאות/פוזיציות/עקומה; רק רושם התאמה חד-פעמית בחשבון. paper-rebase-force מבצע שוב גם אם כבר יש התאמה
          if [ "$CMD" = "paper-rebase" ] || [ "$CMD" = "paper-rebase-force" ]; then
            RB=""; [ "$CMD" = "paper-rebase-force" ] && RB="&force=1"
            echo "=== paper rebase"; curl -sS --max-time 60 -X POST "$W/paper/rebase?secret=$SECRET$RB" | head -c 1500 || echo "::warning::paper-rebase נכשל"; echo
            WORKER_URL="$W" node invest-api/scripts/paper-check.mjs || echo "::warning::paper-check נכשל"
          fi
          # פעולה: paper-autopilot-only <ts> — החשבון משקף רק את האוטומט: רישומים שלא הוא יצר מוסרים (לארכיון), מזומן חוזר, התאמות מתאפסות
          if [ "$CMD" = "paper-autopilot-only" ]; then
            echo "=== paper autopilot-only"; curl -sS --max-time 60 -X POST "$W/paper/autopilot-only?secret=$SECRET" | head -c 1500 || echo "::warning::autopilot-only נכשל"; echo
            WORKER_URL="$W" node invest-api/scripts/paper-check.mjs || echo "::warning::paper-check נכשל"
          fi
          # אבחון: kv-usage <ts> — כמה כתיבות/קריאות KV נעשו היום, לפי namespace (מכסת התוכנית החינמית: 1,000 כתיבות/יום לכל החשבון).
          # GraphQL Analytics של Cloudflare עם CF_API_TOKEN; מדפיס מספרים בלבד, בלי ערכי סוד
          if [ "$CMD" = "kv-usage" ]; then
            echo "=== kv-usage $(date -u +%F)"
            # מזהה החשבון: כמו ב-deploy — הסוד אם תקין, אחרת מהטוקן
            ACCT="${{ secrets.CF_ACCOUNT_ID }}"
            if ! echo "$ACCT" | grep -qE '^[0-9a-f]{32}$'; then ACCT=$(curl -sS -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if d.get("success") and r else "")'); fi
            [ -n "$ACCT" ] || { echo "::warning::kv-usage: לא נמצא מזהה חשבון"; ACCT=x; }
            NS=$(curl -sS -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts/$ACCT/storage/kv/namespaces?per_page=100" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({n["id"]: n["title"] for n in (d.get("result") or [])}) if d.get("success") else (print("{}"), print("namespaces error:", [e.get("message") for e in d.get("errors",[])], file=sys.stderr))[0])' || echo '{}')
            echo "namespaces: $(echo "$NS" | python3 -c 'import json,sys; print(sorted(json.load(sys.stdin).values()))')"
            for D in $(date -u +%F) $(date -u -d yesterday +%F); do
              Q=$(python3 -c 'import json,sys; a,d=sys.argv[1:]; print(json.dumps({"query":"query($a:String!,$d:Date!){viewer{accounts(filter:{accountTag:$a}){kvOperationsAdaptiveGroups(limit:200,filter:{date:$d}){sum{requests} dimensions{namespaceId actionType}}}}}","variables":{"a":a,"d":d}}))' "$ACCT" "$D")
              curl -sS -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql -d "$Q" | NS="$NS" D="$D" python3 -c '

          import json,sys,os
          ns=json.loads(os.environ["NS"]); d=json.load(sys.stdin)
          if d.get("errors"): print(os.environ["D"], "errors:", [e.get("message") for e in d["errors"]][:3]); sys.exit(0)
          rows=(((d.get("data") or {}).get("viewer") or {}).get("accounts") or [{}])[0].get("kvOperationsAdaptiveGroups") or []
          agg={}
          for r in rows: k=(ns.get(r["dimensions"]["namespaceId"], r["dimensions"]["namespaceId"][:8]), r["dimensions"]["actionType"]); agg[k]=agg.get(k,0)+r["sum"]["requests"]
          print(os.environ["D"] + ":"); [print("  ", k[0], k[1], v) for k,v in sorted(agg.items())]
          print("   total writes:", sum(v for k,v in agg.items() if k[1]=="write"))' || echo "::warning::kv-usage: השאילתה נכשלה ל-$D"
            done
          fi
          if [ "$CMD" = "macro-check" ]; then
            echo "=== macro-check"; curl -sS --max-time 30 "$W/macro" | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(k, "rows:", len(v.get("rows",[])), "asOf:", v.get("asOf"), "last:", (v.get("rows") or [[None,None]])[-1], "source:", v.get("source")) for k,v in d.items()]'
          fi
          if [ "$CMD" = "aggressive-reset" ]; then
            echo "=== aggressive reset (מתחיל מחדש עם הציון האגרסיבי)"; curl -sS --max-time 120 -X POST "$W/aggressive/run?secret=$SECRET&reset=1" | head -c 800; echo
          fi
          if [ "$CMD" = "universe-refresh" ] || [ "$CMD" = "universe-reset" ]; then
            RESET=""; [ "$CMD" = "universe-reset" ] && RESET="&reset=1"
            echo "=== universe-refresh"; curl -sS --max-time 120 -X POST "$W/universe/refresh?secret=$SECRET$RESET" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, ensure_ascii=False)[:1500])'
            echo "=== shadow-run"; curl -sS --max-time 120 -X POST "$W/shadow/run?secret=$SECRET" | head -c 600; echo
            echo "=== mechanical"; curl -sS --max-time 30 "$W/universe?origin=mechanical" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("count:", d.get("count"), [a["symbol"] for a in d.get("items",[])][:40])'
            echo "=== universe size"; curl -sS --max-time 30 "$W/universe" | python3 -c 'import json,sys; d=json.load(sys.stdin); import collections; print("total:", d.get("count"), dict(collections.Counter(a.get("origin") for a in d.get("items",[]))))'
          fi
          if [ "$CMD" = "auto-run" ] || [ "$CMD" = "cron-run" ]; then
            echo "=== aggressive execute (גיבוי לחלון ניו יורק)"; curl -sS --max-time 120 -X POST "$W/aggressive/execute?secret=$SECRET" | head -c 500; echo
            echo "=== autopilot"; curl -sS --max-time 120 -X POST "$W/auto/run?secret=$SECRET&trigger=github" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ran:", d.get("ran"), d.get("reason",""), "day:", d.get("day")); print("regime:", (d.get("regime") or {}).get("summary")); print("before:", d.get("before"), "after:", d.get("after")); [print("  ", o["side"], o["qty"], "x", o["symbol"], o.get("name"), "@", o.get("price"), "ok" if o.get("ok") else "ERR " + str(o.get("error")), "|", o.get("reason")) for o in d.get("orders",[])]; print("notes:", d.get("notes")); [print("  skip", s["symbol"], "|", s["reason"]) for s in d.get("skipped",[])]'
          fi
          # שערוך לפי סגירה מאומתת: שורת השווי של הסשן האחרון לתרגול ולאגרסיבי (final רק כשכל השערים סגירות של אותו סשן) — AI_COUNCIL#17
          echo "=== mark to close"; curl -sS --max-time 120 -X POST "$W/mark/run?secret=$SECRET" | head -c 900 || echo "::warning::mark/run נכשל"; echo
          echo "=== auto status (last run)"; curl -sS --max-time 30 "$W/auto/status" | python3 -c 'import json,sys; d=json.load(sys.stdin); l=d.get("last") or {}; print("enabled:", d.get("enabled"), "profile:", d.get("profile"), "runs:", len(d.get("journal",[]))); print("last:", l.get("ts"), l.get("day"), l.get("trigger"), "rules v", l.get("rulesVersion")); print("regime:", (l.get("regime") or {}).get("summary")); print("before:", l.get("before"), "after:", l.get("after")); [print("  ", o["side"], o["qty"], "x", o["symbol"], o.get("name"), "@", o.get("price"), "ok" if o.get("ok") else "ERR " + str(o.get("error")), "|", o.get("reason")) for o in l.get("orders",[])]; print("notes:", l.get("notes")); [print("  skip", s["symbol"], "|", s["reason"]) for s in l.get("skipped",[])]'
          echo "=== shadow"; curl -sS --max-time 30 "$W/shadow/report" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("day:", d.get("day"), "n:", d.get("n"), "missing:", d.get("missing"), d.get("reason","")); print("agreement:", d.get("agreement")); print("actions:", {m: (d.get("models") or {}).get(m,{}).get("actions") for m in "ABC"}); print("top:", d.get("top")); print("revisions:", d.get("revisionsAvailable"), "used:", d.get("revisionsUsed"), "histDays:", d.get("revisionHistoryDays")); print("dupes:", (d.get("corr") or {}).get("dupes")); st=(d.get("stats") or {}).get("horizons") or {}; [print("  h", h, "days", v.get("days"), {m: {"n": x.get("n"), "ic": x.get("ic"), "mono": x.get("monotonic"), "buy": (x.get("actions") or {}).get("BUY"), "sell": (x.get("actions") or {}).get("SELL")} for m, x in (v.get("models") or {}).items()}) for h, v in st.items()]'
          echo "=== aggressive"; curl -sS --max-time 30 "$W/aggressive/report" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("day:", d.get("day"), "model:", d.get("model"), d.get("variant"), "total:", d.get("totalIls"), "spyRef:", d.get("spyRef"), "missing:", d.get("missing")); print("exposure:", d.get("exposure")); p=d.get("pending") or {}; print("pending:", p.get("day"), [(o["side"], o["qty"], o["symbol"], o.get("filled")) for o in p.get("orders", [])]); print("sectors:", [(x["sector"], x["share"]) for x in (d.get("sectors") or [])[:6]]); print("metrics:", d.get("metrics")); print("stats:", d.get("stats")); print("positions:", [(p["symbol"], p["valueIls"], p.get("pnlPct")) for p in (d.get("positions") or [])]); [print("  ", t["day"], t["side"], t["qty"], "x", t["symbol"], "@", t["price"], "|", t.get("reason")) for t in (d.get("trades") or [])[:8]]'
          echo "=== agent"; curl -sS --max-time 30 "$W/agent/report" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("missing:", d.get("reason")) if d.get("missing") else (print("day:", d.get("day"), "equity:", d.get("totalIls"), "₪ (", d.get("equityUsd"), "$) pnl:", d.get("pnlPct"), "day:", d.get("dayPnlUsd"), "$ leverage:", d.get("leverage"), "positions:", len(d.get("positions") or []), "kill:", d.get("policy",{}).get("killSwitch"), "halted:", d.get("halted")), print("exposure:", d.get("exposure",{}).get("byClass")), [print("  ", p["side"], p["qty"], "x", p["symbol"], "@", p["avg"], "→", p["price"], "pnl", p["pnlUsd"], "|", p["strategy"]) for p in (d.get("positions") or [])[:12]], print("pending:", [(o["side"], o["qty"], o["symbol"], o["strategy"]) for o in (d.get("pending") or {}).get("orders", [])]), print("opps:", (d.get("opportunities") or {}).get("summary"), "rejections:", len((d.get("opportunities") or {}).get("gateLog") or [])))' || echo "::warning::agent report failed"
          echo "=== cron status"; curl -sS --max-time 30 "$W/cron/status" | head -c 1500; echo
          echo "=== rank"; curl -sS --max-time 30 "$W/rank" | head -c 500; echo
      # דוח תקינות יומי → תגובה ב-Issue #25 (AI Council). פעם ביום (לפי סמן <!-- health-report YYYY-MM-DD --> בתגובה האחרונה),
      # או בכוח בפקודת ops "health-report". קריאה בלבד מה-API הציבורי; בלי סודות; בלי מודל
      - name: Daily health report → AI Council issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          W=https://invest-api.meirco199.workers.dev
          ISSUE=25
          CMD=$(cat .github/invest-ops/command 2>/dev/null | head -1 | cut -d" " -f1 || echo cron-run)
          [ "${{ github.event_name }}" = "push" ] || CMD=cron-run
          TODAY=$(date -u +%F)
          LAST=$(gh api "repos/${{ github.repository }}/issues/$ISSUE/comments?per_page=100" --jq '[.[] | select(.body | startswith("<!-- health-report"))] | last | .body' 2>/dev/null | head -1 || true)
          if [ "$CMD" != "health-report" ] && echo "$LAST" | grep -q "health-report $TODAY"; then echo "דוח התקינות של $TODAY כבר פורסם — מדלג"; exit 0; fi
          WORKER_URL="$W" RUN_URL="$RUN_URL" node invest-api/scripts/health-report.mjs > /tmp/health.md || { echo "::warning::health-report נכשל"; exit 0; }
          cat /tmp/health.md
          gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" -f body="$(cat /tmp/health.md)" --silent && echo "פורסם ב-Issue #$ISSUE" || echo "::warning::פרסום הדוח ל-Issue נכשל (הרשאות?)"
