# זמני, בענף research/daytrading בלבד — יוסר בסוף. מחקר "יתרון מאירועים" (דוחות, חדשות, זרימות סוף יום). קריאה בלבד, אין פקודות.
# נתוני Alpaca נשמרים רק במטמון הפרטי של Actions (תנאי הרישיון). פקודות: probe | ...
name: research-ee-tmp
on:
  push:
    branches: [research/daytrading]
    paths: ['.github/event-edge/command']
permissions: { contents: write }
concurrency: { group: research-ee, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: command
        id: cmd
        run: echo "cmd=$(head -1 .github/event-edge/command | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: probe
        if: steps.cmd.outputs.cmd == 'probe'
        run: node invest-api/scripts/research-ee-probe.mjs | tee invest/docs/research/event-edge/data-gate-probe.json
      - name: unit tests
        run: node --test invest-api/tests/research-event-edge.test.mjs
      - name: restore private data cache
        if: contains(fromJSON('["run1","final"]'), steps.cmd.outputs.cmd)
        uses: actions/cache/restore@v4
        with:
          path: ~/eedata
          key: ee-data-v1-${{ github.run_id }}
          restore-keys: ee-data-v1-
      - name: fetch (skips what is cached)
        if: contains(fromJSON('["run1","final"]'), steps.cmd.outputs.cmd)
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: node --max-old-space-size=6000 invest-api/scripts/research-ee-fetch.mjs --data ~/eedata
      - name: save private data cache
        if: always() && contains(fromJSON('["run1","final"]'), steps.cmd.outputs.cmd)
        uses: actions/cache/save@v4
        with:
          path: ~/eedata
          key: ee-data-v1-${{ github.run_id }}
      - name: run
        if: contains(fromJSON('["run1","final"]'), steps.cmd.outputs.cmd)
        run: node --max-old-space-size=6500 invest-api/scripts/research-ee-run.mjs --data ~/eedata --phase ${{ steps.cmd.outputs.cmd }}
      - name: commit aggregated results only
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/event-edge
          git commit -m "ops: מחקר יתרון מאירועים — ${{ steps.cmd.outputs.cmd }} (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin research/daytrading && git push origin HEAD:research/daytrading && break; sleep 5; done
