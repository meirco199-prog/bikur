# זמני, בענף המחקר בלבד (research/bot2-regime) — יוסר אחרי ההרצה האחת. מחקר בלבד: אין פקודות, אין מפתחות.
name: research-bot2-regime-tmp
on:
  push:
    branches: [research/bot2-regime]
    paths: ['.github/bot2-regime/command']
permissions: { contents: write }
concurrency: { group: research-bot2-regime, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/research-bot2-regime.test.mjs invest-api/tests/research-bot2-maker.test.mjs
      - uses: actions/cache@v4
        with: { path: amit-course-cache, key: binance-um-1m-2020-01-2026-10-bot2regime-v1, restore-keys: binance-um-1m- }
      - name: run (once)
        run: |
          node --max-old-space-size=6500 invest-api/scripts/research-bot2-regime.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/bot2-regime > /dev/null
          cat invest/docs/research/bot2-regime/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/bot2-regime
          git commit -m "ops: תוצאות מחקר בוט 2 לפי משטר תנודתיות (ריצה ${{ github.run_id }})" || true
          for i in 1 2 3; do git pull --rebase origin research/bot2-regime && git push origin HEAD:research/bot2-regime && break; sleep 5; done
