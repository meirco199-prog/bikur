# זמני (ops): כיוון 2 — איסוף היסטוריית דמי המימון של BTC/ETH ממקורות ציבוריים (scripts/funding-history-probe.mjs). קריאה בלבד — אין כסף, אין פקודות, אין מפתחות.
name: funding-probe
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/funding-probe.yml]
permissions: { contents: write }
concurrency: { group: funding-probe, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: run
        run: node invest-api/scripts/funding-history-probe.mjs --out invest/docs/research/funding-crash | tee -a "$GITHUB_STEP_SUMMARY"
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/funding-crash
          git commit -m "ops: היסטוריית דמי המימון — מקורות זמינים (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
