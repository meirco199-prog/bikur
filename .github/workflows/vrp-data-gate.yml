# זמני (ops; ריצה 4 — בדיקה משלימה לשלב 4 בלבד: שווי יומי מעסקאות ציבוריות של Deribit עם דפדוף מלא, היסטוריית מחיר סימון,
# בדיקת GET ליום שני בחודש ב-Tardis, ובדיקה חוזרת של קובצי עסקאות). שער הנתונים של מחקר VRP — בלי Backtest, בלי מסחר, בלי מפתחות.
name: vrp-data-gate
on:
  push:
    branches: [research/vrp-defined-risk-options]
    paths: [.github/workflows/vrp-data-gate.yml]
permissions: { contents: write }
concurrency: { group: vrp-data-gate, cancel-in-progress: false }
jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: probe2
        run: |
          D=invest/docs/research/vrp-options/data_gate
          timeout 2700 python3 $D/probe2.py $D/results/samples.json $D/results/probe2.json || echo "probe2 נעצר ($?)"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/vrp-options/data_gate/results
          git commit -m "ops(vrp): שער הנתונים — בדיקה משלימה לשווי יומי (ריצה ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
