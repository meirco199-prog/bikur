# זמני (ops): מחקר Cross-Asset Momentum + Risk Parity — שער נתונים (Yahoo/FRED) ואם PASS הרצה לפי PROTOCOL_v1.0.md. ענף מחקר בלבד; יוסר בסוף.
name: carp-run
on:
  push:
    branches: [research/cross-asset-risk-parity]
    paths: [.github/workflows/carp-run.yml]
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fetch + gate + run
        run: |
          D=invest/docs/research/cross-asset-risk-parity
          python3 $D/carp.py fetch raw
          python3 $D/carp.py run raw $D/results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: carp-raw, path: raw, retention-days: 30 }
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/cross-asset-risk-parity/results
          git commit -m "ops(carp): שער נתונים והרצה לפי PROTOCOL_v1.0 (ריצה ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
