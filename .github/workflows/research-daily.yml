# זמני (ops): שיטות קריפטו ארוכות טווח על נרות יומיים מ-2016 (engine/research-daily.js). מחקר בלבד — אין פקודות ואין מפתחות.
# .github/research/mode: dev = תקופת המבחן מוסתרת; final = ריצה אחת בסוף עם --show-test.
name: research-daily
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-daily.yml, .github/research/mode]
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: daily-data.json.gz, key: research-daily-2016-2026-11-07-v1 }
      - name: run
        run: |
          MODE=$(tr -d '[:space:]' < .github/research/mode)
          FLAG=""; [ "$MODE" = "final" ] && FLAG="--show-test"
          node invest-api/scripts/research-daily.mjs --start 2016-01-01 --end 2026-11-07 --data daily-data.json.gz --out research-daily.md $FLAG
      - uses: actions/upload-artifact@v4
        with: { name: research-daily, path: 'research-daily.md' }
