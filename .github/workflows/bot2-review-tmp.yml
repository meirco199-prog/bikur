# זמני, בענף research/bot2-review בלבד — יוסר אחרי הקריאה. קריאה בלבד מהשרת: קובץ המצב של בוט 2 (עסקאות סגורות) ויומן השירות. אין פקודות.
name: bot2-review-tmp
on:
  push:
    branches: [research/bot2-review]
    paths: ['.github/bot2-review/command']
permissions: { contents: write }
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: read bot 2 trades and journal (read-only)
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@$SERVER_HOST"
          mkdir -p invest/docs/research/bot2-review
          $SSH 'H=$(getent passwd bridge | cut -d: -f6); python3 -c "import json,sys; s=json.load(open(sys.argv[1])); print(json.dumps({\"startedAt\":s.get(\"startedAt\"),\"trades\":s.get(\"trades\",[])}))" "$H/.bikur-bybit/state2.json"' > invest/docs/research/bot2-review/trades.json
          $SSH 'journalctl -u bikur-bybit2 --since "30 days ago" -o short-iso --no-pager | grep -E "כניסה|סטופ למחיר|עסקה נסגרה|סגירה בשוק|אות בלי כניסה|מגבלת הפסד|בוט 2 של עמית" || true' > invest/docs/research/bot2-review/journal.txt
          wc -l invest/docs/research/bot2-review/*
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/bot2-review
          git commit -m "ops: קריאת עסקאות בוט 2 (ריצה ${{ github.run_id }})" || true
          for i in 1 2 3; do git pull --rebase origin research/bot2-review && git push origin HEAD:research/bot2-review && break; sleep 5; done
