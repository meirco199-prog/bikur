# זמני (ops): קריאה בלבד של מסלול אגרסיבי B ומדד הייחוס — GET ציבורי, בלי סודות, בלי כתיבה. יוסר מיד.
name: ops-bots-snapshot
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/ops-bots-snapshot.yml]
permissions: { contents: read }
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: snapshot
        run: |
          python3 - <<'PY'
          import json, urllib.request
          B='https://invest-api.meirco199.workers.dev/'
          def g(ep):
              with urllib.request.urlopen(urllib.request.Request(B+ep, headers={'User-Agent':'bikur-ops'}), timeout=40) as r: return json.loads(r.read())
          a=g('tracks/aggrB')
          print('KEYS', list(a.keys()) if isinstance(a, dict) else type(a))
          for k, v in (a.items() if isinstance(a, dict) else []):
              if isinstance(v, list):
                  print(f'\n## {k} ({len(v)})')
                  for x in v: print(json.dumps(x, ensure_ascii=False)[:900])
              elif isinstance(v, dict):
                  print(f'\n## {k}'); print(json.dumps(v, ensure_ascii=False)[:3000])
              else: print(f'{k}: {json.dumps(v, ensure_ascii=False)[:300]}')
          c=g('tracks/compare')
          for it in c.get('items', []):
              print('\nCMP', it.get('id'), json.dumps({k: it.get(k) for k in ('startDay','totalIls','metrics','excess','costs')}, ensure_ascii=False)[:1200])
          sp=c.get('benchmarks',{}).get('spy95',{}).get('equity',[])
          print('\nSPY95', json.dumps([[x['day'], x['total']] for x in sp]))
          PY
