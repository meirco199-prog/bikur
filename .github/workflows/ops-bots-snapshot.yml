# זמני (ops): תמונת מצב לקריאה בלבד של כל מעקבי הנייר והדמו — GET ציבורי בלבד מה-Worker, בלי סודות, בלי כתיבה. יוסר מיד אחרי הקריאה.
name: ops-bots-snapshot
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/ops-bots-snapshot.yml]
permissions: { contents: read }
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: snapshot
        run: |
          python3 - <<'PY'
          import json, urllib.request
          B='https://invest-api.meirco199.workers.dev/'
          def show(x, depth=0, key=''):
              pad='  '*depth
              if isinstance(x, dict):
                  for k, v in x.items():
                      if isinstance(v, (dict, list)) and depth < 3:
                          print(f'{pad}{k}: ({type(v).__name__}, {len(v)})'); show(v, depth+1, k)
                      else:
                          s=json.dumps(v, ensure_ascii=False); print(f'{pad}{k}: {s[:300]}')
              elif isinstance(x, list):
                  if not x: return
                  idx = list(range(len(x))) if len(x) <= 4 else [0, len(x)-3, len(x)-2, len(x)-1]
                  for i in idx: print(f'{pad}[{i}] {json.dumps(x[i], ensure_ascii=False)[:700]}')
          for ep in ['xsra','xsrb','xsmom','vbo','dc','amit','sinay','aggressive','tracks','shadow']:
              print(f'\n=================== {ep} ===================')
              try:
                  with urllib.request.urlopen(urllib.request.Request(B+ep, headers={'User-Agent':'bikur-ops'}), timeout=40) as r:
                      j=json.loads(r.read())
                  show(j)
              except Exception as e:
                  print('ERROR', e)
          PY
