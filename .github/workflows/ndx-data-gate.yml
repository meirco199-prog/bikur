# זמני (ops): שער נתונים למחקר מומנטום Nasdaq-100 — בדיקת מקורות חינמיים בלבד (בלי מפתחות, בלי רכישה, בלי סימולציה). ענף מחקר בלבד; יוסר בסוף.
name: ndx-data-gate
on:
  push:
    branches: [research/nasdaq100-momentum]
    paths: [.github/workflows/ndx-data-gate.yml]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          R=invest/docs/research/nasdaq100-momentum/data_gate/results; mkdir -p $R
          python3 invest/docs/research/nasdaq100-momentum/data_gate/probe_free.py $R/free_sources.json
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/nasdaq100-momentum/data_gate/results
          git commit -m "ops(ndx): שער נתונים — בדיקת מקורות חינמיים (ריצה ${GITHUB_RUN_ID})" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
