# מחקר (זמני): משיכת היסטוריית נרות 15 דקות של BTC/ETH/LTC/BCH/ADA מ-API ציבורי (בלי מפתחות) ושמירה בענף העבודה —
# לבדיקה לאחור של כללי ה-PDF (Issue #189). רץ רק בדחיפה של קובץ הבקשה בענף של Claude. לא נוגע ב-main.
name: Crypto history (research)
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: ['.github/crypto-history/request']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candles
        run: python3 .github/crypto-history/fetch.py "$(head -1 .github/crypto-history/request | awk '{print $1}')"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/crypto-history/data
          git commit -m "ops: crypto-history data (research)" && git push
