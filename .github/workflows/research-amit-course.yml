# בדיקה לאחור של שיטת הקורס של עמית (scripts/research-amit-course.mjs, engine/amit-course.js). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
# נתונים: נרות דקה של חוזי הפרפטואל ב-Binance מ-data.binance.vision (קבצים ציבוריים), 9 מטבעות, 5 שנים. נשמרים ב-cache בין ריצות.
# הרצה: Actions → research-amit-course → Run workflow, או דחיפה של .github/amit-course/command לענף שאינו main
#   (תוכן הקובץ: "run" — תקופת המבחן מוסתרת; "show-test" — פותחים את המבחן, פעם אחת, בסוף;
#    "explore" — חקירת 1,620 גרסאות (סטופ צמוד, יציאה מהירה, ווליום) עם מבחן נקי 2020–2021, scripts/research-amit-explore.mjs;
#    "validate" — הגרסאות המובילות מהחקירה, שנקבעו מראש, על 20 מטבעות חדשים;
#    "full" — המחקר המלא לפי הבריף: משפחות חלופיות, לונג ושורט, שכבת תיק, scripts/research-amit-full.mjs;
#    "stop3" — בוט 3: איך מגבילים את ההפסד כשגם המנה השלישית נכנסת (בקשת מאיר 11/11/2026), scripts/research-amit3-stop.mjs →
#    invest/docs/research/amit3-stop;
#    "be2" — בוט 2: מתי להזיז את הסטופ למחיר הכניסה (בקשת מאיר 12/11/2026), scripts/research-amit2-be.mjs → invest/docs/research/amit2-be;
#    "guard1" — בוט 1: סינון "סכין נופלת" וסטופ נגרר אחרי רווח (בקשת מאיר 12/11/2026), scripts/research-amit1-guard.mjs →
#    invest/docs/research/amit1-guard;
#    "exit3" — בוט 3: יציאה "בקו השני, עד 1.8%" (בקשת מאיר 13/11/2026), scripts/research-amit3-exit.mjs → invest/docs/research/amit3-exit).
# התוצאות (report.md / report-test.md + summary*.json) נשמרות כ-artifact ונדחפות לענף שעליו רץ ה-workflow (לא ל-main).
name: research-amit-course
on:
  workflow_dispatch:
    inputs:
      show_test: { description: 'לפתוח את תקופת המבחן (פעם אחת, בסוף)', type: boolean, default: false }
      explore: { description: 'חקירת 1,620 גרסאות (research-amit-explore.mjs)', type: boolean, default: false }
  push:
    branches-ignore: [main]
    paths: ['.github/amit-course/command']
permissions: { contents: write }
concurrency: { group: research-amit-course, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/amit-course.test.mjs invest-api/tests/research-amit3-stop.test.mjs invest-api/tests/research-amit2-be.test.mjs invest-api/tests/research-amit1-guard.test.mjs
      - uses: actions/cache@v4
        with: { path: amit-course-cache, key: binance-um-1m-2020-01-2026-10-29coins-v2, restore-keys: binance-um-1m- }
      - name: mode
        id: mode
        run: |
          M=run
          if [ "${{ github.event_name }}" = "push" ]; then M=$(tr -d '[:space:]' < .github/amit-course/command); fi
          if [ "${{ inputs.explore }}" = "true" ]; then M=explore; fi
          if [ "${{ inputs.show_test }}" = "true" ]; then M=show-test; fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"; echo "mode: $M"
      - name: explore
        if: steps.mode.outputs.mode == 'explore'
        run: |
          node --max-old-space-size=6500 invest-api/scripts/research-amit-explore.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit-course > /dev/null
          cat invest/docs/research/amit-course/explore.md >> "$GITHUB_STEP_SUMMARY"
      - name: full
        if: steps.mode.outputs.mode == 'full'
        run: |
          # המחקר המלא לפי הבריף של מאיר (10/11/2026): גרסת הקורס, הגרסה ה"מזוקקת", שטיפה וחזרה, ריטסט, קווי בסיס — לונג ושורט, 29 מטבעות
          node --max-old-space-size=6500 invest-api/scripts/research-amit-full.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit-course > /dev/null
          cat invest/docs/research/amit-course/full-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: stop3
        if: steps.mode.outputs.mode == 'stop3'
        run: |
          # בוט 3: משקלות המנות וכללים אחרי מילוי מלא; קריטריון שנקבע מראש בראש הסקריפט. 8 מטבעות הבוט + 20 מטבעות חדשים לאימות
          node --max-old-space-size=6500 invest-api/scripts/research-amit3-stop.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit3-stop > /dev/null
          cat invest/docs/research/amit3-stop/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: be2
        if: steps.mode.outputs.mode == 'be2'
        run: |
          # בוט 2: כללי הזזת הסטופ למחיר הכניסה על ETH 2020–2026; קריטריון שנקבע מראש בראש הסקריפט
          node --max-old-space-size=6500 invest-api/scripts/research-amit2-be.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit2-be > /dev/null
          cat invest/docs/research/amit2-be/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: exit3
        if: steps.mode.outputs.mode == 'exit3'
        run: |
          # בוט 3: יציאה מוקדמת בקו השני / עד 1.8% / יעד קבוע, על 8 מטבעות 2020–2026 + 20 מטבעות חדשים; הכרעה שנקבעה מראש בראש הסקריפט
          node --max-old-space-size=6500 invest-api/scripts/research-amit3-exit.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit3-exit > /dev/null
          cat invest/docs/research/amit3-exit/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: guard1
        if: steps.mode.outputs.mode == 'guard1'
        run: |
          # בוט 1: סינון "סכין נופלת" וסטופ נגרר על BTC 2020–2026; קריטריון שנקבע מראש בראש הסקריפט
          node --max-old-space-size=6500 invest-api/scripts/research-amit1-guard.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit1-guard > /dev/null
          cat invest/docs/research/amit1-guard/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: validate
        if: steps.mode.outputs.mode == 'validate'
        run: |
          # אימות על 20 מטבעות שלא היו בחקירה; הגרסאות נקבעו מראש (10/11/2026) לפי explore.md — לא משנים אחרי הריצה
          node --max-old-space-size=6500 invest-api/scripts/research-amit-explore.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit-course \
            --coins XRP,DOGE,LINK,DOT,LTC,BCH,ATOM,UNI,AAVE,FIL,ETC,XLM,TRX,ALGO,SAND,AXS,APT,ARB,OP,SUI --cats DOGE:vol \
            --validate "deep-kv10-reclaim|ladder-slcourse-tp1-4h,deep-kv10-green|ladder-slcourse-tp1-4h,half-kv10-green|ladder-slcourse-tp1-4h,half-kv10-reclaim|ladder-slcourse-tp1-4h" > /dev/null
          cat invest/docs/research/amit-course/validate.md >> "$GITHUB_STEP_SUMMARY"
      - name: research
        if: steps.mode.outputs.mode == 'run' || steps.mode.outputs.mode == 'show-test'
        run: |
          FLAGS=""
          if [ "${{ steps.mode.outputs.mode }}" = "show-test" ]; then FLAGS="--show-test"; fi
          echo "flags: $FLAGS"
          node --max-old-space-size=6500 invest-api/scripts/research-amit-course.mjs --cache amit-course-cache --outdir invest/docs/research/amit-course $FLAGS > /dev/null
          cat invest/docs/research/amit-course/report*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: amit-course-results
          path: |
            invest/docs/research/amit-course
            invest/docs/research/amit3-stop
            invest/docs/research/amit2-be
            invest/docs/research/amit1-guard
            invest/docs/research/amit3-exit
      - name: commit results
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/amit-course
          if [ -d invest/docs/research/amit3-stop ]; then git add invest/docs/research/amit3-stop; fi
          if [ -d invest/docs/research/amit2-be ]; then git add invest/docs/research/amit2-be; fi
          if [ -d invest/docs/research/amit1-guard ]; then git add invest/docs/research/amit1-guard; fi
          if [ -d invest/docs/research/amit3-exit ]; then git add invest/docs/research/amit3-exit; fi
          git commit -m "ops: תוצאות בדיקת שיטת הקורס של עמית (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
