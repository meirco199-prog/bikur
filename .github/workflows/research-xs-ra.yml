# זמני (ops): מומנטום בין מטבעות "משודרג" (scripts/research-xs-ra.mjs). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
# התוצאות נדחפות ל-invest/docs/research/xs-ra בענף שעליו רץ ה-workflow (לא ל-main).
# ריצה 2: ייחוס הרווח למטבעות לפי שנה וחציון זוגות ימי ההחלפה.
name: research-xs-ra
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-xs-ra.yml]
permissions: { contents: write }
concurrency: { group: research-xs-ra, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: xsra-data.json.gz, key: research-xsra-2016-2026-11-13-v1 }
      - name: tests
        run: node --test invest-api/tests/research-daily.test.mjs
      - name: run
        run: |
          mkdir -p invest/docs/research/xs-ra
          node --max-old-space-size=6000 invest-api/scripts/research-xs-ra.mjs --data xsra-data.json.gz --out invest/docs/research/xs-ra/report.md --json invest/docs/research/xs-ra/results.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/xs-ra
          git commit -m "ops: תוצאות המומנטום המשודרג בין מטבעות (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
