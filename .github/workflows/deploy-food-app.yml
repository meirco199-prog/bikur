# פריסה אוטומטית של יומן האוכל המשפחתי ל-Cloudflare Workers.
# כל דחיפה לענף האפליקציה שמשנה את index.html מעלה אותה לכתובת קבועה:
#   https://food.<subdomain>.workers.dev
# משתמש באותם Secrets שכבר מוגדרים בריפו עבור remi:
#   CF_API_TOKEN (חובה), CF_ACCOUNT_ID (אופציונלי — מתגלה אוטומטית)

name: Deploy food app to Cloudflare

on:
  push:
    branches: [claude/kids-nutrition-app-ek0f9r]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-food-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build worker with the app embedded
        run: |
          python3 - <<'EOF'
          import base64
          html = open('index.html', 'rb').read()
          b64 = base64.b64encode(html).decode()
          worker = (
              'const HTML_B64 = "' + b64 + '";\n'
              'function page() {\n'
              '  const bin = atob(HTML_B64);\n'
              '  const bytes = new Uint8Array(bin.length);\n'
              '  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);\n'
              '  return new TextDecoder().decode(bytes);\n'
              '}\n'
              'export default {\n'
              '  async fetch() {\n'
              '    return new Response(page(), { headers: {\n'
              '      "content-type": "text/html; charset=utf-8",\n'
              '      "cache-control": "no-store"\n'
              '    }});\n'
              '  }\n'
              '};\n'
          )
          open('worker.js', 'w').write(worker)
          print('worker size:', len(worker))
          EOF

      - name: Deploy worker "food"
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "::error::חסר הסוד CF_API_TOKEN בהגדרות הריפו"
            exit 1
          fi
          ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          if ! echo "$ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            ACCOUNT_ID=$(curl -sS "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if d.get("success") and r else "")')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::לא הצלחתי לגלות את מזהה החשבון מהטוקן"
            exit 1
          fi
          echo "account: ${ACCOUNT_ID:0:6}..."

          resp=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/food" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module')
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("upload success:", d.get("success"), json.dumps(d.get("errors"), ensure_ascii=False)); sys.exit(0 if d.get("success") else 1)'

          sub=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/food/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":false}')
          echo "subdomain enable: $sub"

          SUBDOMAIN=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain",""))')
          echo "APP_URL=https://food.$SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"
          echo "app url: https://food.$SUBDOMAIN.workers.dev"

      - name: Verify app answers
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$APP_URL/" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::האפליקציה באוויר: $APP_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::האפליקציה לא עונה ב-$APP_URL"
          exit 1
