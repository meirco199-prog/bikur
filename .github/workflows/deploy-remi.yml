# פריסה אוטומטית של הבוט ל-Cloudflare — בלי הדבקות ידניות.
# כל דחיפה ל-main שמשנה את worker.js מעלה אותו ישר ל-Worker בשם remi,
# באותה דרך שהדשבורד עושה "Edit code" — הקוד מתחלף, וכל ההגדרות
# (Secrets, KV, Workers AI, Cron) נשארות בדיוק כמו שהן.
#
# הגדרה חד-פעמית (Settings → Secrets and variables → Actions):
#   CF_API_TOKEN  — טוקן מ-dash.cloudflare.com (תבנית "Edit Cloudflare Workers")
#   CF_ACCOUNT_ID — מזהה החשבון (מופיע במסך Workers & Pages בצד)

name: Deploy remi to Cloudflare
# (עדכון קל כדי לעורר ריצה מחדש — אירועי הדחיפה של רביעי בערב אבדו בתקלת GitHub)

on:
  push:
    branches: [main]
    paths:
      - 'remi-telegram-free/worker.js'
      - '.github/workflows/deploy-remi.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload worker.js (content-only, keeps all bindings)
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "::error::חסר הסוד CF_API_TOKEN בהגדרות הריפו (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # מגלים את מזהה החשבון אוטומטית מהטוקן — לא צריך CF_ACCOUNT_ID
          ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          if ! echo "$ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            ACCOUNT_ID=$(curl -sS "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if d.get("success") and r else "")')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::לא הצלחתי לגלות את מזהה החשבון מהטוקן — בדוק שהטוקן נוצר מתבנית Edit Cloudflare Workers"
            exit 1
          fi
          echo "account: ${ACCOUNT_ID:0:6}..."
          resp=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/remi/content" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@remi-telegram-free/worker.js;type=application/javascript+module')
          echo "$resp"
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") else 1)'
          # מוודאים שהשעון קיים — כל 2 דקות: רווח שגדול מזמן הסנכרון של האחסון,
          # כדי ששתי ריצות עוקבות בשרתים שונים לא ישלחו את אותה תזכורת פעמיים
          sched=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/remi/schedules" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{"cron":"*/2 * * * *"}]')
          echo "$sched"
          echo "$sched" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") else 1)'

      - name: Verify worker answers
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://remi.meirco199.workers.dev/)
          echo "worker HTTP status: $code"
          test "$code" = "200"

      # תמונת מצב טכנית של השעון והתזכורות (שעות ומזהים בלבד, בלי תוכן אישי)
      - name: Health snapshot
        run: |
          curl -sS --max-time 30 "https://remi.meirco199.workers.dev/health?secret=remi-meir-2026" || true
