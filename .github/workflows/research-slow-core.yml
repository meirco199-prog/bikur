# זמני (ops): מחקר 7כח — Slow Core Momentum, ענף מחקר נפרד (scripts/research-slow-core.mjs). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות, לא נוגע ב-XSRA-7.
name: research-slow-core
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-slow-core.yml]
permissions: { contents: write }
concurrency: { group: research-slow-core, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: xsra-data.json.gz, key: research-xsra-2016-2026-11-13-v1 }
      - name: data (אם המטמון לא זמין)
        run: '[ -f xsra-data.json.gz ] || node invest-api/scripts/research-xs-ra.mjs --data xsra-data.json.gz > /dev/null'
      - name: tests
        run: node --test invest-api/tests/slow-core.test.mjs invest-api/tests/xsra-protect.test.mjs
      - name: run
        run: |
          mkdir -p invest/docs/research/slow-core-momentum
          node --max-old-space-size=6000 invest-api/scripts/research-slow-core.mjs --data xsra-data.json.gz --bybit invest/docs/research/xs-protect/bybit-probe.json --out invest/docs/research/slow-core-momentum/report.md --json invest/docs/research/slow-core-momentum/results.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/slow-core-momentum
          git commit -m "ops: תוצאות Slow Core Momentum (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
