# זמני (ops): קנייה בקריסות חדות (FLASH_BASES ב-engine/research.js) — שנתיים, נרות 5 דקות, ~26 מטבעות. מחקר בלבד — אין פקודות ואין מפתחות.
# .github/research/mode: dev = תקופת המבחן מוסתרת; final* = ריצה אחת בסוף עם --show-test.
name: research-flash
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-flash.yml, .github/research/mode]
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: flash-data.json.gz, key: research-flash-2026-11-07-730-v1 }
      - name: run
        run: |
          MODE=$(tr -d '[:space:]' < .github/research/mode)
          FLAG=""; [ "${MODE#final}" != "$MODE" ] && FLAG="--show-test"
          node --max-old-space-size=6144 invest-api/scripts/research-flash.mjs --end 2026-11-07 --days 730 --data flash-data.json.gz --out research-flash.md $FLAG
      - uses: actions/upload-artifact@v4
        with: { name: research-flash, path: 'research-flash.md' }
