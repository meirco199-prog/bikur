# זמני (ops): כיוון 3 — זרימות לקרנות הסל על ביטקוין (scripts/etf-flows-probe.mjs). קריאה ציבורית בלבד — אין כסף, אין פקודות, אין מפתחות.
name: etf-probe
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/etf-probe.yml]
permissions: { contents: write }
concurrency: { group: etf-probe, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: run
        run: node invest-api/scripts/etf-flows-probe.mjs --out invest/docs/research/etf-flows | tee -a "$GITHUB_STEP_SUMMARY"
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/etf-flows
          git commit -m "ops: זרימות לקרנות הסל — מקורות (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
