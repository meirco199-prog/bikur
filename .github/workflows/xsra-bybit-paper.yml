# מעקב וירטואלי שני — מומנטום 7ל על 38 המטבעות של Bybit + 2 הגנות (engine/xsra-bybit-paper.js). תיק וירטואלי — אין כסף, אין פקודות, אין מפתחות מסחר.
# נפרד מ-XSRA-7 המקורי (xsra-paper.yml): שעה אחרת (01:20 UTC, אחרי שהמקורי מתעדכן ב-00:50), קבוצת concurrency אחרת, נתיב ומפתח KV אחרים (/xsrb, paper:xsrb).
# את המקורי קוראים רק דרך GET /xsra הציבורי, להשוואה באותם מועדים.
name: XSRA Bybit paper (daily)
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xsrb-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: invest-api
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: step
        env:
          WORKER_URL: https://invest-api.meirco199.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::חסר הסוד CRON_SECRET"; exit 1; fi
          node invest-api/scripts/xsra-bybit-paper.mjs
