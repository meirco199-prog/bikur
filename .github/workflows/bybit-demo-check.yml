# בדיקה זמנית (ops): האם מפתח הדמו של Bybit עובד — מהשרת של בעל הריפו (Bybit חוסמת שרתים בארה"ב, כמו GitHub).
# קריאה בלבד (פרטי המפתח + יתרה), בלי פקודות. לא מדפיס מפתחות; הם עוברים ב-stdin של SSH, לא בשורת הפקודה.
name: bybit-demo-check
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/bybit-demo-check.yml]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
      K: ${{ secrets.BYBIT_DEMO_API_KEY }}
      S: ${{ secrets.BYBIT_DEMO_API_SECRET }}
    steps:
      - name: check from owner's server (read-only)
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          echo "key present: $([ -n "$K" ] && echo yes) | secret present: $([ -n "$S" ] && echo yes) | server: $([ -n "$SERVER_HOST" ] && echo yes)"
          {
            printf 'export K=%q S=%q\n' "$K" "$S"
            cat <<'SH'
          echo "server country: $(curl -s -m 5 https://ipinfo.io/country || echo '?')"
          node - <<'JS'
          const crypto = require('crypto');
          const K = process.env.K, S = process.env.S, base = 'https://api-demo.bybit.com';
          async function get(path, qs){
            const ts = String(Date.now()), rw = '10000';
            const sign = crypto.createHmac('sha256', S).update(ts + K + rw + qs).digest('hex');
            const r = await fetch(`${base}${path}${qs ? '?' + qs : ''}`, { headers: { 'X-BAPI-API-KEY': K, 'X-BAPI-TIMESTAMP': ts, 'X-BAPI-RECV-WINDOW': rw, 'X-BAPI-SIGN': sign } });
            const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch {}
            return { status: r.status, j, head: j ? '' : t.slice(0, 160) };
          }
          (async () => {
            const a = await get('/v5/user/query-api', '');
            console.log('query-api http', a.status, 'retCode', a.j?.retCode, a.j?.retMsg, a.head);
            if (a.j?.result){ const x = a.j.result; console.log('readOnly', x.readOnly, '| permissions', JSON.stringify(x.permissions), '| expiredAt', x.expiredAt, '| uta', x.uta); }
            const b = await get('/v5/account/wallet-balance', 'accountType=UNIFIED');
            console.log('wallet http', b.status, 'retCode', b.j?.retCode, b.j?.retMsg, b.head);
            const acc = b.j?.result?.list?.[0]; if (acc) console.log('totalEquity', acc.totalEquity, '| available', acc.totalAvailableBalance);
          })().catch((e) => console.log('error', String(e).slice(0, 200)));
          JS
          SH
          } | sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$SERVER_HOST" 'bash -s'
