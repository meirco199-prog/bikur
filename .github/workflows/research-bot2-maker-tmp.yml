# זמני, בענף המחקר בלבד (research/bot2-maker) — ביקורת לפני סגירה (אותו קוד, חישובי בקרה). יוסר מיד. מחקר בלבד: אין פקודות, אין מפתחות.
name: research-bot2-maker-audit-tmp
on:
  push:
    branches: [research/bot2-maker]
    paths: ['.github/bot2-maker/command']
permissions: { contents: write }
concurrency: { group: research-bot2-maker, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: amit-course-cache, key: binance-um-1m-2020-01-2026-10-29coins-v2, restore-keys: binance-um-1m- }
      - name: audit
        run: |
          node --max-old-space-size=6500 invest-api/scripts/research-bot2-maker-audit.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/bot2-maker > /dev/null
          cat invest/docs/research/bot2-maker/audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/bot2-maker/audit.md
          git commit -m "ops: ביקורת לפני סגירה — בוט 2 ממתינים (ריצה ${{ github.run_id }})" || true
          for i in 1 2 3; do git pull --rebase origin research/bot2-maker && git push origin HEAD:research/bot2-maker && break; sleep 5; done
