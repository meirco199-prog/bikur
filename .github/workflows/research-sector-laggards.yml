# מחקר "המפגרות בסקטור שעולה" (scripts/research-sector-laggards.mjs, invest/docs/research/sector-laggards/). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
# השאלה (מאיר, 11/11/2026): ביום שסקטור עולה ולא כל המניות בו עולות — האם כדאי לקנות את אלה שירדו או עלו הכי מעט?
# נתונים: Yahoo Finance יומי 2007→היום, הרכב S&P 500 היסטורי, 11 קרנות SPDR (אותו מקור כמו research-xsec).
# הרצה: Actions → research-sector-laggards → Run workflow, או דחיפה של .github/sector-laggards/command לענף שאינו main.
# התוצאות (report.md, results.csv, meta.json) נשמרות כ-artifact ונדחפות לענף שעליו רץ ה-workflow (לא ל-main).
name: research-sector-laggards
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/sector-laggards/command']
permissions: { contents: write }
concurrency: { group: research-sector-laggards, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/research-sector-laggards.test.mjs invest-api/tests/research-xsec.test.mjs
      - name: research
        run: node --max-old-space-size=6000 invest-api/scripts/research-sector-laggards.mjs --outdir invest/docs/research/sector-laggards
      - uses: actions/upload-artifact@v4
        with: { name: sector-laggards-results, path: invest/docs/research/sector-laggards }
      - name: commit results
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/sector-laggards
          git commit -m "ops: תוצאות מחקר המפגרות בסקטור (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
