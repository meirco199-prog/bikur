# זמני, בענף המחקר בלבד (research/stop-grid) — יוסר אחרי ההרצה האחת. מחקר בלבד: אין פקודות, אין מפתחות.
# הרצה: דחיפה של .github/stop-grid/command. נתונים: Yahoo יומי + הרכב S&P 500 היסטורי (אותו קוד כמו research-bracket2).
name: research-stop-grid-tmp
on:
  push:
    branches: [research/stop-grid]
    paths: ['.github/stop-grid/command']
permissions: { contents: write }
concurrency: { group: research-stop-grid, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/research-stop-grid.test.mjs invest-api/tests/research-xsec.test.mjs
      - name: run (once)
        run: |
          node --max-old-space-size=6000 invest-api/scripts/research-stop-grid.mjs --outdir invest/docs/research/stop-grid > /dev/null
          cat invest/docs/research/stop-grid/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: stop-grid, path: invest/docs/research/stop-grid }
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/stop-grid
          git commit -m "ops: תוצאות מחקר סטופים במניות (ריצה ${{ github.run_id }})" || true
          for i in 1 2 3; do git pull --rebase origin research/stop-grid && git push origin HEAD:research/stop-grid && break; sleep 5; done
