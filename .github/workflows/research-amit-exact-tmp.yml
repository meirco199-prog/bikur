# זמני, בענף המחקר בלבד (research/amit-exact) — יוסר אחרי ההרצה האחת. מחקר בלבד: אין פקודות, אין מפתחות.
name: research-amit-exact-tmp
on:
  push:
    branches: [research/amit-exact]
    paths: ['.github/amit-exact/command']
permissions: { contents: write }
concurrency: { group: research-amit-exact, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/research-amit-exact.test.mjs invest-api/tests/research-amit1-guard.test.mjs
      - uses: actions/cache@v4
        with: { path: amit-course-cache, key: binance-um-1m-2020-01-2026-10-29coins-v2, restore-keys: binance-um-1m- }
      - name: run (once)
        run: |
          node --max-old-space-size=6500 invest-api/scripts/research-amit-exact.mjs --from 2020-01 --to 2026-10 --cache amit-course-cache --outdir invest/docs/research/amit-exact > /dev/null
          cat invest/docs/research/amit-exact/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: amit-exact, path: invest/docs/research/amit-exact }
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/amit-exact
          git commit -m "ops: תוצאות מחקר בוט כמו עמית (ריצה ${{ github.run_id }})" || true
          for i in 1 2 3; do git pull --rebase origin research/amit-exact && git push origin HEAD:research/amit-exact && break; sleep 5; done
