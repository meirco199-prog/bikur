# פריסת שרת התזכורות של אפליקציית האנגלית ל-Cloudflare — אוטומטית בכל דחיפה ל-main.
# משתמש באותם Secrets כמו שאר ה-Workers (CF_API_TOKEN, ואופציונלית CF_ACCOUNT_ID).
# ה-workflow מקים לבד את מרחב ה-KV לשמירת המנויים ואת שעון ה-cron,
# כך שאין שום הגדרה ידנית בדשבורד ואין סודות להזין.

name: Deploy english-push to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'english-push/worker.js'
      - '.github/workflows/deploy-english-push.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker with KV binding and cron
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::חסר הסוד CF_API_TOKEN בהגדרות הריפו (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          ACCOUNT_ID="$CF_ACCOUNT_ID"
          if ! echo "$ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            ACCOUNT_ID=$(curl -sS "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if d.get("success") and r else "")')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::לא הצלחתי לגלות את מזהה החשבון מהטוקן — בדוק שהטוקן נוצר מתבנית Edit Cloudflare Workers"
            exit 1
          fi
          echo "account: ${ACCOUNT_ID:0:6}..."

          # מרחב KV לשמירת המנויים — מאתרים לפי שם, ואם אין יוצרים
          NS_ID=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((n["id"] for n in (d.get("result") or []) if n.get("title")=="english-push"), ""))')
          if [ -z "$NS_ID" ]; then
            NS_ID=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
              --data '{"title":"english-push"}' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("id",""))')
          fi
          if [ -z "$NS_ID" ]; then
            echo "::error::לא הצלחתי ליצור/למצוא את מרחב ה-KV בשם english-push — לטוקן צריכה להיות הרשאת Workers KV Storage:Edit"
            exit 1
          fi
          echo "kv: ${NS_ID:0:6}..."

          resp=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/english-push" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F "metadata={\"main_module\":\"worker.js\",\"compatibility_date\":\"2025-01-01\",\"bindings\":[{\"type\":\"kv_namespace\",\"name\":\"PUSH\",\"namespace_id\":\"$NS_ID\"}]};type=application/json" \
            -F 'worker.js=@english-push/worker.js;type=application/javascript+module')
          echo "$resp"
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") else 1)'

          # שעון: כל 5 דקות — רזולוציה מספיקה לתזכורת יומית, וזול מאוד
          sched=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/english-push/schedules" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            -d '[{"cron":"*/5 * * * *"}]')
          echo "$sched"
          echo "$sched" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") else 1)'

          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/english-push/subdomain" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"enabled": true, "previews_enabled": false}' || true
