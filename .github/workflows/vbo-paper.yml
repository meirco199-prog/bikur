# מעקב Paper Trading לפריצת תנודתיות תוך-יומית על BTC/ETH (engine/vbo-paper.js, crypto-hourly.md). תיק וירטואלי — אין כסף, אין פקודות, אין מפתחות.
# 4 פעמים ביום: נרות שעה סגורים מ-Coinbase → קידום המצב על כל השעות שנסגרו מאז (אותה תוצאה כמו ריצה כל שעה) → POST /vbo ב-invest-api.
# 18:50 UTC — לפני סיכום הקריפטו היומי (21:00 שעון ישראל), שבו מופיעה התוצאה.
name: VBO intraday breakout paper
on:
  schedule:
    - cron: '50 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vbo-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: invest-api
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: step
        env:
          WORKER_URL: https://invest-api.meirco199.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::חסר הסוד CRON_SECRET"; exit 1; fi
          node invest-api/scripts/vbo-paper.mjs
