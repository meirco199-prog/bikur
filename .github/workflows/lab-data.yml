# מעבדת האסטרטגיות — בניית מערך הנתונים ההיסטורי ודוח ייחוס (מחקר בלבד; אין כסף, אין פקודות, אין מפתחות מסחר).
# מה קורה: scripts/lab-data.mjs מוריד הרכב S&P 500 היסטורי (fja05680/sp500) ונרות יומיים מתואמים (Tiingo אם יש TIINGO_KEY, אחרת
# Yahoo chart API כמו בסקריפטי המחקר), כותב קבצים compact לפי עשור, ומריץ את תבנית הייחוס "Top 10 Daily Losers" (scripts/lab-run.mjs).
# הפלט נדחף לענף lab-data (ענף נתונים נפרד, ללא היסטוריה — נכתב מחדש בכל ריצה). האפליקציה invest/lab/ קוראת ממנו דרך raw.githubusercontent.
# הרצה: ידנית (Run workflow) או כל יום ראשון ב-03:20 UTC.
name: Invest lab data
on:
  workflow_dispatch:
    inputs:
      years: { description: 'כמה שנים אחורה', default: '20', required: false }
      limit: { description: 'מגבלת סימבולים (0 = הכול; לבדיקה מהירה 40)', default: '0', required: false }
      provider: { description: 'yahoo | tiingo', default: 'yahoo', required: false }
      run_tests: { description: 'להריץ גם אופטימיזציה ו-Walk-Forward על תבנית הייחוס (איטי)', default: 'true', required: false }
  schedule:
    - cron: '20 3 * * 0'
permissions:
  contents: write
concurrency:
  group: lab-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit tests (lab engine)
        run: node --test invest-api/tests/lab-*.test.mjs
      - name: Build dataset
        env:
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          LAB_YEARS: ${{ inputs.years || '20' }}
          LAB_LIMIT: ${{ inputs.limit || '0' }}
          LAB_PROVIDER: ${{ inputs.provider || 'yahoo' }}
          LAB_OUT: lab-data-out
        run: node invest-api/scripts/lab-data.mjs
      - name: Reference backtest — Top 10 Daily Losers (full history)
        run: |
          set -e
          EXTRA=""; if [ "${{ inputs.run_tests || 'true' }}" = "true" ]; then EXTRA="--optimize --walk"; fi
          node invest-api/scripts/lab-run.mjs --data lab-data-out --template top10-losers-1d $EXTRA --out lab-data-out/results/top10-losers-1d.json --md lab-data-out/results/top10-losers-1d.md > /dev/null
          node invest-api/scripts/lab-run.mjs --data lab-data-out --template top10-gainers-1d --out lab-data-out/results/top10-gainers-1d.json --md lab-data-out/results/top10-gainers-1d.md > /dev/null
          node invest-api/scripts/lab-run.mjs --data lab-data-out --template combo-multi --out lab-data-out/results/combo-multi.json --md lab-data-out/results/combo-multi.md > /dev/null
          node -e "const fs=require('fs');const d='lab-data-out/results';const idx=fs.readdirSync(d).filter(f=>f.endsWith('.json')).map(f=>{const j=JSON.parse(fs.readFileSync(d+'/'+f));return {id:f.replace('.json',''),name:j.spec.name,from:j.result.from,to:j.result.to,cagr:j.analysis.series.cagr,maxDD:j.analysis.series.maxDD,sharpe:j.analysis.series.sharpe,trades:j.analysis.trades.count,finalEquity:j.result.finalEquity,capital:j.result.capital,limited:j.result.limited,builtAt:j.builtAt}});fs.writeFileSync(d+'/index.json',JSON.stringify({builtAt:new Date().toISOString(),runs:idx}))"
          cat lab-data-out/results/top10-losers-1d.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to branch lab-data
        run: |
          set -e
          cd lab-data-out
          git init -q -b lab-data
          git config user.name "invest-lab-bot"; git config user.email "invest-lab-bot@users.noreply.github.com"
          echo "# lab-data — מערך הנתונים של מעבדת האסטרטגיות (נוצר אוטומטית, ראה .github/workflows/lab-data.yml)" > README.md
          git add -A
          git commit -q -m "lab-data: $(date -u +%Y-%m-%dT%H:%MZ) ($(jq -r '.provider' manifest.json | cut -c1-30), $(jq '.symbols|length' manifest.json) series)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" lab-data:lab-data
          echo "pushed lab-data: $(du -sh . | cut -f1)"
