# זמני, בענף המחקר בלבד (research/usdils-nq) — יוסר אחרי ההרצה האחת. מחקר בלבד: אין פקודות, אין מפתחות.
name: research-usdils-nq-tmp
on:
  push:
    branches: [research/usdils-nq]
    paths: ['.github/usdils-nq/command']
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests
        run: node --test invest-api/tests/research-usdils-nq.test.mjs
      - name: run (once)
        run: |
          node invest-api/scripts/research-usdils-nq.mjs --outdir invest/docs/research/usdils-nq > /dev/null
          cat invest/docs/research/usdils-nq/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/usdils-nq
          git commit -m "ops: תוצאות מחקר דולר-שקל לפי נאסד\"ק (ריצה ${{ github.run_id }})" || true
          for i in 1 2 3; do git pull --rebase origin research/usdils-nq && git push origin HEAD:research/usdils-nq && break; sleep 5; done
