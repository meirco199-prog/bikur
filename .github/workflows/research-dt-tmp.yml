# זמני, בענף research/daytrading בלבד — יוסר בסוף המחקר. מחקר מסחר יומי (פרוטוקול v1.1). מחקר בלבד: אין פקודות, אין כסף.
# נתוני Alpaca (SIP) נשמרים רק במטמון הפרטי של Actions — לא בריפו ולא כ-artifact (תנאי הרישיון). לריפו עולות רק תוצאות מצטברות.
# פקודות (שורה ראשונה של .github/daytrading/command): fetch-a … (שלב א, Yahoo) | probe | data | run1 | final <קובץ מועמדות>
name: research-dt-tmp
on:
  push:
    branches: [research/daytrading]
    paths: ['.github/daytrading/command']
permissions: { contents: write }
concurrency: { group: research-dt, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: command
        id: cmd
        run: |
          echo "cmd=$(head -1 .github/daytrading/command | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "args=$(head -1 .github/daytrading/command | cut -s -d' ' -f3-)" >> "$GITHUB_OUTPUT"
      - name: unit tests
        run: node --test invest-api/tests/research-daytrading.test.mjs
      - name: probe alpaca
        if: steps.cmd.outputs.cmd == 'probe'
        run: node invest-api/scripts/research-dt-probe.mjs
      - name: stage A prices (Yahoo)
        if: steps.cmd.outputs.cmd == 'fetch-a'
        run: node invest-api/scripts/research-dt-fetch-a.mjs ${{ steps.cmd.outputs.args }}
      - name: restore private data cache
        if: contains(fromJSON('["data","run1","final"]'), steps.cmd.outputs.cmd)
        uses: actions/cache/restore@v4
        with:
          path: ~/dtdata
          key: dt-data-v1-${{ github.run_id }}
          restore-keys: dt-data-v1-
      - name: fetch Alpaca SIP (skips files already cached)
        if: contains(fromJSON('["data","run1","final"]'), steps.cmd.outputs.cmd)
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          # הנתונים מההרצה הקודמת שלמים (data-audit.json כבר בריפו) — מסמנים כדי לא להוריד שוב
          if [ -f ~/dtdata/universe.json ] && [ -f invest/docs/research/daytrading/results/data-audit.json ] && [ ! -f ~/dtdata/complete.flag ]; then date -u > ~/dtdata/complete.flag; fi
          node --max-old-space-size=6000 invest-api/scripts/research-dt-fetch.mjs --data ~/dtdata
      - name: save private data cache
        if: always() && contains(fromJSON('["data","run1","final"]'), steps.cmd.outputs.cmd)
        uses: actions/cache/save@v4
        with:
          path: ~/dtdata
          key: dt-data-v1-${{ github.run_id }}
      - name: run
        if: contains(fromJSON('["run1","final"]'), steps.cmd.outputs.cmd)
        run: node --max-old-space-size=6500 invest-api/scripts/research-dt-run.mjs --data ~/dtdata --phase ${{ steps.cmd.outputs.cmd }} ${{ steps.cmd.outputs.args }}
      - name: commit aggregated results only
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/daytrading
          git commit -m "ops: תוצאות מחקר מסחר יומי — ${{ steps.cmd.outputs.cmd }} (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin research/daytrading && git push origin HEAD:research/daytrading && break; sleep 5; done
