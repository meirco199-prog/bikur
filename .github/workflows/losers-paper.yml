# מעקב Paper Trading יומי ל"3 המניות שירדו 3%–7%" במניות ארה״ב (engine/losers-paper.js, research/losers-sim.md). תיק וירטואלי — אין כסף, אין פקודות.
# בימי חול ב-21:40 UTC (אחרי סגירת וול סטריט, גם בשעון חורף): נרות יומיים מ-Yahoo → קידום המצב → POST /losers ב-invest-api (CRON_SECRET).
# התוצאה מופיעה בסיכום היומי בטלגרם.
name: Losers paper (daily)
on:
  schedule:
    - cron: '40 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: losers-paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: invest-api
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: step
        env:
          WORKER_URL: https://invest-api.meirco199.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::חסר הסוד CRON_SECRET"; exit 1; fi
          node invest-api/scripts/losers-paper.mjs
