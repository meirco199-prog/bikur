# בדיקות היחידה של GPT Reviewer עצמו (הסקריפט שמרכיב את ההקשר, סופר סבבים ומפרסם) — רצות רק כשנוגעים בו.
name: CI (gpt-review)

on:
  pull_request:
    paths:
      - '.github/gpt-review/**'
      - '.github/workflows/gpt-review.yml'
      - '.github/workflows/ci-gpt-review.yml'

jobs:
  test:
    name: gpt-review tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/gpt-review/review.test.mjs
