# התקנה/בדיקה מרחוק של הגשר לחשבון הדמה של IBKR על השרת של בעל הריפו (החלטת מאיר 27/9: "תתקין לבד"; הרשאות ב-.claude/settings.json).
# מתחבר ב-SSH לשרת (Ubuntu/Debian חדש) עם פרטי גישה מ-Actions Secrets ומריץ .github/bridge/remote-install.sh:
# Docker+Node+git, IBeam (Client Portal Gateway עם התחברות אוטומטית לחשבון הדמה), הגשר כשירות. ראה invest/docs/IBKR_BRIDGE.md.
# Secrets (Settings → Secrets and variables → Actions): SERVER_HOST (כתובת IP), SERVER_ROOT_PASSWORD, IBKR_PAPER_USER, IBKR_PAPER_PASSWORD, BRIDGE_SECRET.
# שום ערך לא נכתב לריפו או ללוג; סיסמאות נשמרות רק על השרת (קבצים 600). check/restart/logs לא צריכים את סודות IBKR.
name: IBKR bridge — install on owner's server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'install (התקנה/עדכון מלא) | update (משיכת קוד הגשר מ-main + ריסטארט, בלי לגעת ב-IBeam) | check (סטטוס) | restart | stop (עצירת החיבור) | logs | diag (למה ה-Gateway לא עולה) | secrets (אילו סודות מוגדרים)'
        required: true
        default: 'check'
        type: choice
        options: [install, update, check, restart, stop, logs, debug, diag, options, optprobe, page, probe, secrets, live-install, live-update, live-check, live-logs, live-debug, live-stop, live-arm, live-disarm]
      live_account:
        description: 'live-install בלבד: מספר החשבון האמיתי (U…). לא סוד. הגשר מסרב לכל חשבון אחר'
        required: false
        default: ''
        type: string
      live_approval:
        description: 'live-arm בלבד: hash המגבלות (מודפס בהתחלת הלוג של live-check ובדוח /agent/live/report כ-limitsHash). שינוי כלשהו במגבלות מבטל אישור'
        required: false
        default: ''
        type: string
      live_days:
        description: 'live-arm בלבד: לכמה ימים להפעיל (1–45). בסיום חוזרים לכבוי אוטומטית'
        required: false
        default: '7'
        type: string
      live_confirm:
        description: 'live-arm בלבד: כתוב בדיוק  כסף-אמיתי-מאושר  כדי להפעיל מסחר בכסף אמיתי'
        required: false
        default: ''
        type: string
      paper_user:
        description: 'שם משתמש הדמה (Paper Trading Username) — אם ניתן, עוקף את הסוד IBKR_PAPER_USER בהתקנה. לא סוד (הסיסמה נשארת מהסוד)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency: bridge-install

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
      IBKR_PAPER_USER: ${{ secrets.IBKR_PAPER_USER }}
      IBKR_PAPER_PASSWORD: ${{ secrets.IBKR_PAPER_PASSWORD }}
      BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      WORKER_URL: https://invest-api.meirco199.workers.dev
      ACTION: ${{ inputs.action }}
      PAPER_USER_OVERRIDE: ${{ inputs.paper_user }}
      IBKR_LIVE_USER: ${{ secrets.IBKR_LIVE_USER }}
      IBKR_LIVE_PASSWORD: ${{ secrets.IBKR_LIVE_PASSWORD }}
      LIVE_ACCOUNT: ${{ inputs.live_account }}
      LIVE_APPROVAL_IN: ${{ inputs.live_approval }}
      LIVE_DAYS: ${{ inputs.live_days }}
      LIVE_CONFIRM: ${{ inputs.live_confirm }}
    steps:
      - uses: actions/checkout@v4
      - name: Which secrets are set (names only)
        run: |
          for v in SERVER_HOST SSHPASS IBKR_PAPER_USER IBKR_PAPER_PASSWORD BRIDGE_SECRET IBKR_LIVE_USER IBKR_LIVE_PASSWORD; do n="$v"; [ "$v" = SSHPASS ] && n=SERVER_ROOT_PASSWORD; if [ -n "${!v}" ]; then echo "✅ $n מוגדר"; else echo "❌ $n חסר"; fi; done
          [ "$ACTION" != "secrets" ] || exit 0
          miss=""
          for v in SERVER_HOST SSHPASS; do [ -n "${!v}" ] || miss="$miss $v"; done
          if [ "$ACTION" = "install" ]; then for v in IBKR_PAPER_USER IBKR_PAPER_PASSWORD BRIDGE_SECRET; do [ -n "${!v}" ] || miss="$miss $v"; done; fi
          if [ "$ACTION" = "live-install" ]; then for v in IBKR_LIVE_USER IBKR_LIVE_PASSWORD BRIDGE_SECRET LIVE_ACCOUNT; do [ -n "${!v}" ] || miss="$miss $v"; done; [ -z "$IBKR_LIVE_USER" ] || echo "::add-mask::$IBKR_LIVE_USER"; fi
          if [ -n "$miss" ]; then echo "::error::חסרים Secrets:$miss (Settings → Secrets and variables → Actions)"; exit 1; fi
          [ -z "$IBKR_PAPER_USER" ] || echo "::add-mask::$IBKR_PAPER_USER"
          [ -z "$PAPER_USER_OVERRIDE" ] || echo "משתמש הדמה מהקלט של ההרצה יחליף את הסוד IBKR_PAPER_USER בהתקנה הזו"
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect IBKR login page (runner only, no server)
        if: inputs.action == 'page'
        run: |
          # האם דף הכניסה של IBKR (זה שה-Gateway מגיש) כולל מתג Live/Paper? שדות הטופס? — כדי לדעת אם צריך ללחוץ "Paper" בכניסה עם המשתמש האמיתי
          curl -sS -L -A "Mozilla/5.0" -o /tmp/login.html -w "HTTP %{http_code} → %{url_effective}\n" "https://www.interactivebrokers.com/sso/Login?forwardTo=22&RL=1&ip2loc=on" || true
          wc -c /tmp/login.html
          echo "--- title/inputs/paper"
          grep -oiE "<title>[^<]{0,120}</title>|<input[^>]{0,200}>|paper[^\"<>]{0,100}|live[^\"<>]{0,60}trading[^\"<>]{0,60}|id=\"[^\"]*(paper|live|toggle|switch)[^\"]*\"|class=\"[^\"]*(paper|toggle|switch)[^\"]*\"" /tmp/login.html | sort -u | head -60
          echo "--- scripts"
          grep -oiE "src=\"[^\"]*\.js[^\"]*\"" /tmp/login.html | sort -u | head -20
      - name: Probe IBKR login page with a real browser (runner only, no credentials)
        if: inputs.action == 'probe'
        run: |
          # מה באמת מוצג בדף הכניסה (הוא נבנה ב-JavaScript): מתג Live/Paper? שדות? — הבסיס לאוטומציית כניסה משלנו במקום IBeam
          mkdir -p /tmp/probe && cd /tmp/probe && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/bridge/probe-login.mjs" /tmp/probe/ && node /tmp/probe/probe-login.mjs
      - name: Run on server
        if: inputs.action != 'secrets' && inputs.action != 'page' && inputs.action != 'probe'
        run: |
          set -e
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@$SERVER_HOST"
          case "$ACTION" in
            check)   $SSH 'echo "host: $(hostname) · $(uptime -p)"; systemctl is-active bikur-bridge 2>/dev/null | sed "s/^/bridge service: /"; docker ps --filter name=ibeam --format "ibeam: {{.Status}}" 2>/dev/null; curl -sk -X POST https://localhost:5000/v1/api/iserver/auth/status 2>/dev/null | head -c 300; echo; journalctl -u bikur-bridge -n 8 --no-pager 2>/dev/null; true' ;;
            restart) $SSH 'docker restart ibeam >/dev/null && systemctl restart bikur-bridge && echo restarted' ;;
            # עדכון קוד הגשר בלבד: git pull + ריסטארט השירות. ה-Gateway (IBeam) והסשן מול IBKR לא נוגעים בהם
            update)  $SSH 'H=$(getent passwd bridge | cut -d: -f6); sudo -u bridge git -C "$H/bikur" pull -q && sudo -u bridge git -C "$H/bikur" log --oneline -1 && systemctl restart bikur-bridge && sleep 3 && systemctl is-active bikur-bridge | sed "s/^/bridge service: /"' ;;
            # בדיקה לקריאה בלבד: האם חשבון הדמה מורשה לאופציות ויש שרשרת ל-SPY (אין פקודות, אין סודות)
            options) cat .github/bridge/options-check.sh | $SSH 'bash -s' ;;
            # פתרון חוזה אופציה + ציטוט + what-if (קריאה בלבד, לא שולח פקודה)
            optprobe) cat .github/bridge/options-probe.sh | $SSH 'bash -s' ;;
            stop)    $SSH 'docker stop ibeam >/dev/null; systemctl stop bikur-bridge; echo "stopped: ibeam + bridge"' ;;
            # --- הגשר לחשבון האמיתי (invest/docs/LIVE_BRIDGE.md). live-install מתקין *כבוי*; רק live-arm (בעל הריפו, עם אישור מפורש) מאפשר שליחת פקודות ---
            live-install)
              { printf 'export IB_USER=%q IB_PASS=%q BRIDGE_SECRET=%q WORKER_URL=%q LIVE_ACCOUNT=%q\n' "$IBKR_LIVE_USER" "$IBKR_LIVE_PASSWORD" "$BRIDGE_SECRET" "$WORKER_URL" "$LIVE_ACCOUNT"; cat .github/bridge/live-install.sh; } | $SSH 'bash -s' ;;
            live-check) $SSH 'echo "host: $(hostname) · $(uptime -p)"; free -m | sed -n 2p; systemctl is-active bikur-live-bridge 2>/dev/null | sed "s/^/live bridge service: /"; docker ps --filter name=ibeam-live --format "ibeam-live: {{.Status}}" 2>/dev/null; curl -sk -X POST -H "User-Agent: bikur-ibkr-bridge" -H "Content-Type: application/json" -d "{}" https://localhost:5001/v1/api/iserver/auth/status 2>/dev/null | head -c 300; echo; echo "--- armed? (שמות המפתחות בלבד, בלי ערכים רגישים)"; grep -oE "^(LIVE_ACCOUNT|LIVE_APPROVAL|LIVE_ARMED_UNTIL)=" /etc/bikur-bridge/live.env | tr "\n" " "; echo; grep -E "^LIVE_ARMED_UNTIL=" /etc/bikur-bridge/live.env; ls $(getent passwd bridge | cut -d: -f6)/.bikur-bridge/LIVE_OFF 2>/dev/null && echo "קובץ LIVE_OFF קיים — הגשר עצור"; journalctl -u bikur-live-bridge -n 12 --no-pager 2>/dev/null; true' ;;
            # אבחון כניסה (קריאה בלבד): מה הדף שה-Gateway ראה כשנתקע בשלב 2FA (כותרות/הודעות מה-HTML של IBeam) + שורות הכניסה מהלוג. בלי סיסמאות
            live-debug) $SSH 'rm -rf /tmp/ibl; docker cp ibeam-live:/srv/outputs /tmp/ibl 2>/dev/null || echo "no outputs dir"; ls -la /tmp/ibl 2>/dev/null | tail -20; for f in $(ls -t /tmp/ibl/*.html 2>/dev/null | head -3); do echo "== $f"; grep -oiE "<title>[^<]{0,120}</title>|(error|invalid|incorrect|expired|denied|locked|two.?factor|2fa|ib ?key|notification|challenge|approve|timeout|maintenance|unavailable|live|paper)[^<]{0,140}" "$f" | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig" | sort -u | head -40; done; echo "--- ibeam-live log (login lines)"; docker logs ibeam-live 2>&1 | grep -iE "login|authenticat|2fa|two|notification|status|error|trigger|target" | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig" | tail -50' ;;
            # עדכון קוד הגשר החי בלבד: git pull + ריסטארט השירות. ה-Gateway (ibeam-live) והסשן מול IBKR לא נוגעים בו — אין צורך באישור IB Key
            live-update) $SSH 'H=$(getent passwd bridge | cut -d: -f6); sudo -u bridge git -C "$H/bikur" pull -q && sudo -u bridge git -C "$H/bikur" log --oneline -1 && systemctl restart bikur-live-bridge && sleep 3 && systemctl is-active bikur-live-bridge | sed "s/^/live bridge service: /"' ;;
            live-logs)  $SSH 'journalctl -u bikur-live-bridge -n 80 --no-pager; echo "--- ibeam-live"; docker logs --tail 40 ibeam-live 2>&1 | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig"' ;;
            # עצירה מיידית: קובץ LIVE_OFF (הגשר מבטל פקודות פתוחות ולא שולח), עצירת השירות והקונטיינר. אפשר להריץ בכל רגע
            live-stop)  $SSH 'H=$(getent passwd bridge | cut -d: -f6); mkdir -p "$H/.bikur-bridge"; touch "$H/.bikur-bridge/LIVE_OFF"; chown -R bridge:bridge "$H/.bikur-bridge"; systemctl stop bikur-live-bridge; docker stop ibeam-live >/dev/null 2>&1; echo "stopped: live bridge + ibeam-live (LIVE_OFF נוצר)"' ;;
            live-disarm) $SSH 'sed -i "/^LIVE_APPROVAL=/d;/^LIVE_ARMED_UNTIL=/d" /etc/bikur-bridge/live.env && systemctl restart bikur-live-bridge && echo "disarmed: הגשר החי חזר למצב כבוי (קריאה בלבד)"' ;;
            live-arm)
              [ "$LIVE_CONFIRM" = "כסף-אמיתי-מאושר" ] || { echo "::error::להפעלת מסחר בכסף אמיתי יש לכתוב בדיוק: כסף-אמיתי-מאושר"; exit 1; }
              [[ "$LIVE_APPROVAL_IN" =~ ^[0-9a-f]{8}-[0-9]+$ ]] || { echo "::error::live_approval חייב להיות ה-hash של המגבלות (למשל 630487b7-335)"; exit 1; }
              [[ "$LIVE_DAYS" =~ ^[0-9]+$ ]] && [ "$LIVE_DAYS" -ge 1 ] && [ "$LIVE_DAYS" -le 45 ] || { echo "::error::live_days חייב להיות 1–45"; exit 1; }
              $SSH "rm -f \$(getent passwd bridge | cut -d: -f6)/.bikur-bridge/LIVE_OFF /etc/bikur-bridge/LIVE_OFF; sed -i '/^LIVE_APPROVAL=/d;/^LIVE_ARMED_UNTIL=/d' /etc/bikur-bridge/live.env; printf 'LIVE_APPROVAL=%s\nLIVE_ARMED_UNTIL=%s\n' '$LIVE_APPROVAL_IN' \"\$(date -u -d '+$LIVE_DAYS days' +%Y-%m-%dT%H:%M:%SZ)\" >> /etc/bikur-bridge/live.env; docker start ibeam-live >/dev/null 2>&1; systemctl restart bikur-live-bridge; sleep 3; systemctl is-active bikur-live-bridge | sed 's/^/live bridge service: /'; grep -E '^LIVE_ARMED_UNTIL=' /etc/bikur-bridge/live.env"
              echo "הופעל. הגשר ישלח פקודות רק אם ה-hash תואם למגבלות בקוד שעל השרת (לבדיקה: live-check, או /agent/live/report → armed)" ;;
            debug)   $SSH 'rm -rf /tmp/ibo; docker cp ibeam:/srv/outputs /tmp/ibo 2>/dev/null || echo "no outputs dir"; ls -la /tmp/ibo 2>/dev/null | tail -20; for f in $(ls -t /tmp/ibo/*.html 2>/dev/null | head -3); do echo "== $f"; grep -oiE "<title>[^<]{0,120}</title>|(error|invalid|incorrect|expired|denied|paper|two.?factor|notification|timeout|maintenance|unavailable)[^<]{0,140}" "$f" | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig" | sort -u | head -40; done; echo "--- ibeam log (login lines)"; docker logs ibeam 2>&1 | grep -iE "login|authenticat|2fa|two|notification|paper|status|error" | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig" | tail -60' ;;
            logs)    $SSH 'journalctl -u bikur-bridge -n 60 --no-pager; echo "--- ibeam"; docker logs --tail 40 ibeam 2>&1 | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig"' ;;
            # IBeam נכשל ב-ERR_CONNECTION_REFUSED מול https://localhost:5000 שבתוך הקונטיינר — כלומר ה-Gateway
            # (ה-Java של IBKR) לא הקשיב בכלל, והכניסה ל-IBKR לא התחילה. כאן מסתכלים על *עליית* ה-Gateway:
            # תחילת הלוג (ולא הזנב), מצב הקונטיינר, זיכרון פנוי ו-OOM — שרת 2GB מריץ Java+Chrome במקביל.
            diag)    $SSH 'set +e
              echo "=== מצב הקונטיינר"; docker inspect ibeam --format "status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}" 2>&1
              echo "=== זיכרון"; free -m
              sw=$(swapon --show 2>/dev/null); echo "--- swap: ${sw:-(אין swap)}"
              oom=$( (dmesg -T 2>/dev/null || journalctl -k --no-pager 2>/dev/null) | grep -iE "out of memory|oom.kill|killed process" | tail -15 )
              echo "=== OOM kills: ${oom:-(אין)}"
              echo "=== דיסק"; df -h / | tail -1
              echo "=== 120 השורות הראשונות של IBeam (עליית ה-Gateway)"
              docker logs ibeam 2>&1 | head -120 | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig"
              echo "=== שורות Gateway/Java/port מכל הלוג"
              docker logs ibeam 2>&1 | grep -iE "gateway|java|port|listen|conf\\.yaml|refus|memory|heap|version" | sed -E "s/(password|passwd)[^ ]*/[REDACTED]/Ig" | tail -40
              true' ;;
            install)
              # הסודות עוברים בערוץ ה-SSH המוצפן כשורת export בתחילת הסקריפט (stdin) — לא בשורת פקודה ולא בלוג
              { printf 'export IB_USER=%q IB_PASS=%q BRIDGE_SECRET=%q WORKER_URL=%q\n' "${PAPER_USER_OVERRIDE:-$IBKR_PAPER_USER}" "$IBKR_PAPER_PASSWORD" "$BRIDGE_SECRET" "$WORKER_URL"; cat .github/bridge/remote-install.sh; } | $SSH 'bash -s' ;;
          esac
