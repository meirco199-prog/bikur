# בוטי מסלול עמית בחשבון הדמו של Bybit (כסף וירטואלי): bikur-bybit (בוט 1, BTC) + bikur-bybit2 (בוט 2, ETH) + bikur-bybit3 (בוט 3, שיטת הקורס, 8 מטבעות) — התקנה/עדכון/עצירה על השרת של בעל הריפו. פירוט: invest/docs/BYBIT_BOT.md
# Bybit חוסמת שרתים בארה"ב (כמו ה-runner של GitHub), ולכן הבוט רץ על השרת (גרמניה) וה-workflow רק מתחבר אליו ב-SSH.
# Secrets: SERVER_HOST, SERVER_ROOT_PASSWORD, BYBIT_DEMO_API_KEY, BYBIT_DEMO_API_SECRET, BRIDGE_SECRET (לדיווח ל-Worker).
name: Bybit demo bot (Amit)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'install (התקנה/עדכון מלא + הפעלה) | update (משיכת קוד + ריסטארט) | status | logs | stop (עצירה מיידית: ביטול פקודות + סגירת פוזיציה) | start (ביטול עצירה) | stop1 / start1 (בוט 1 בלבד) | stop3 / start3 (בוט 3 בלבד) | summary3 (סיכום בוט 3) | summary1 (כל הכניסות והעסקאות שנסגרו של בוט 1, 7 ימים) | probe4 (בדיקת נתונים — חוזי מניות ב-Bybit, קריאה בלבד) | research4 (בדיקה לאחור "כמו עמית" על חוזי המניות, קריאה בלבד, עד 40 דק׳) | analyze1 (ניתוח עומק של עסקאות בוט 1 — מה גורם להפסדים, קריאה בלבד) | probexs (אילו ממטבעות המומנטום המשודרג נסחרים בספוט של Bybit ובדמו — קריאה בלבד)'
        required: true
        default: 'status'
        type: choice
        options: [install, update, status, logs, stop, start, stop1, start1, stop3, start3, summary3, summary1, probe4, research4, analyze1, probexs]

permissions:
  contents: read

concurrency: bybit-bot

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
      BYBIT_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
      BYBIT_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
      BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      WORKER_URL: https://invest-api.meirco199.workers.dev
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - name: Run on server
        run: |
          set -e
          miss=""; for v in SERVER_HOST SSHPASS BYBIT_KEY BYBIT_SECRET BRIDGE_SECRET; do if [ -n "${!v}" ]; then echo "✅ $v"; else echo "❌ $v חסר"; miss=1; fi; done
          [ -z "$miss" ] || { echo "::error::חסרים Secrets (Settings → Secrets and variables → Actions)"; exit 1; }
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@$SERVER_HOST"
          # STOP: הבוט מבטל את הפקודות שלו וסוגר פוזיציה בתוך כ-5 שניות, ואז השירות נעצר
          case "$ACTION" in
            install) { printf 'export BYBIT_KEY=%q BYBIT_SECRET=%q BRIDGE_SECRET=%q WORKER_URL=%q\n' "$BYBIT_KEY" "$BYBIT_SECRET" "$BRIDGE_SECRET" "$WORKER_URL"; cat .github/bybit/bot-install.sh; } | $SSH 'bash -s' ;;
            update)  $SSH 'H=$(getent passwd bridge | cut -d: -f6); sudo -u bridge git -C "$H/bikur" pull -q && sudo -u bridge git -C "$H/bikur" log --oneline -1 && for s in bikur-bybit bikur-bybit2 bikur-bybit3; do systemctl is-enabled -q $s && systemctl restart $s; done; sleep 5; for s in bikur-bybit bikur-bybit2 bikur-bybit3; do systemctl is-active $s | sed "s/^/$s: /"; done; true' ;;
            status)  $SSH 'H=$(getent passwd bridge | cut -d: -f6); ls "$H/.bikur-bybit/STOP" 2>/dev/null && echo "STOP קיים — הבוטים עצורים"; ls "$H/.bikur-bybit/STOP1" 2>/dev/null && echo "STOP1 קיים — בוט 1 עצור"; ls "$H/.bikur-bybit/STOP3" 2>/dev/null && echo "STOP3 קיים — בוט 3 עצור"; for s in bikur-bybit bikur-bybit2 bikur-bybit3; do echo "=== $s: $(systemctl is-active $s)"; journalctl -u $s -n 25 --no-pager; done; true' ;;
            logs)    $SSH 'for s in bikur-bybit bikur-bybit2 bikur-bybit3; do echo "=== $s"; journalctl -u $s -n 120 --no-pager; done' ;;
            stop)    $SSH 'H=$(getent passwd bridge | cut -d: -f6); mkdir -p "$H/.bikur-bybit"; touch "$H/.bikur-bybit/STOP"; chown -R bridge:bridge "$H/.bikur-bybit"; sleep 15; journalctl -u bikur-bybit -n 6 --no-pager; journalctl -u bikur-bybit2 -n 6 --no-pager; journalctl -u bikur-bybit3 -n 6 --no-pager; systemctl stop bikur-bybit bikur-bybit2 bikur-bybit3; echo "stopped (STOP נשאר עד start)"' ;;
            stop1)   $SSH 'H=$(getent passwd bridge | cut -d: -f6); mkdir -p "$H/.bikur-bybit"; touch "$H/.bikur-bybit/STOP1"; chown -R bridge:bridge "$H/.bikur-bybit"; systemctl restart bikur-bybit; sleep 20; journalctl -u bikur-bybit -n 10 --no-pager; systemctl stop bikur-bybit; systemctl disable -q bikur-bybit; echo "בוט 1 נעצר ובוטל (STOP1 נשאר עד start1). בוט 2: $(systemctl is-active bikur-bybit2)"' ;;
            stop3)   $SSH 'H=$(getent passwd bridge | cut -d: -f6); mkdir -p "$H/.bikur-bybit"; touch "$H/.bikur-bybit/STOP3"; chown -R bridge:bridge "$H/.bikur-bybit"; sleep 75; journalctl -u bikur-bybit3 -n 12 --no-pager; systemctl stop bikur-bybit3; systemctl disable -q bikur-bybit3; echo "בוט 3 נעצר ובוטל (STOP3 נשאר עד start3)"' ;;
            start3)  $SSH 'H=$(getent passwd bridge | cut -d: -f6); rm -f "$H/.bikur-bybit/STOP3"; systemctl enable -q bikur-bybit3; systemctl start bikur-bybit3; sleep 5; systemctl is-active bikur-bybit3' ;;
            summary1) $SSH 'journalctl -u bikur-bybit --since "7 days ago" --no-pager | grep -E "כניסה|עסקה נסגרה|סטופ|מגבלה|בוט עמית" || true' ;;
            summary3) $SSH 'H=$(getent passwd bridge | cut -d: -f6); sudo -u bridge bash -c "set -a; . /etc/bikur-bybit/bot.env; set +a; cd $H/bikur && node invest-api/scripts/bybit-amit3-bot.mjs --summary"; ls -la "$H/.bikur-bybit/bars3" 2>/dev/null; journalctl -u bikur-bybit3 -n 40 --no-pager | grep -E "כניסה|מימוש|סגירה|הסתיימה|עצירה" || true' ;;
            probe4)  $SSH 'sudo -u bridge node --input-type=module' < invest-api/scripts/bybit-stocktoken-probe.mjs ;;
            probexs) $SSH 'sudo -u bridge node --input-type=module' < invest-api/scripts/bybit-xsra-probe.mjs | tee probexs.md; cat probexs.md >> "$GITHUB_STEP_SUMMARY" ;;
            research4) { cat invest-api/engine/amit4-open.js; grep -v -e "^import .*amit4-open" -e "^#!" invest-api/scripts/research-amit4-open.mjs; } | $SSH 'sudo -u bridge nice -n 10 node --input-type=module' | tee research4.md; cat research4.md >> "$GITHUB_STEP_SUMMARY" ;;
            analyze1) $SSH 'H=$(getent passwd bridge | cut -d: -f6); journalctl -u bikur-bybit --since "10 days ago" -o short-unix --no-pager | grep נכנסנו > /tmp/bikur-entries1.txt || true; chmod 644 /tmp/bikur-entries1.txt; sudo -u bridge env BOT_STATE=$H/.bikur-bybit/state.json ENTRIES=/tmp/bikur-entries1.txt node --input-type=module' < invest-api/scripts/analyze-bot1-trades.mjs | tee analyze1.md; cat analyze1.md >> "$GITHUB_STEP_SUMMARY" ;;
            start1)  $SSH 'H=$(getent passwd bridge | cut -d: -f6); rm -f "$H/.bikur-bybit/STOP1"; systemctl enable -q bikur-bybit; systemctl start bikur-bybit; sleep 5; systemctl is-active bikur-bybit' ;;
            start)   $SSH 'H=$(getent passwd bridge | cut -d: -f6); rm -f "$H/.bikur-bybit/STOP"; for s in bikur-bybit bikur-bybit2 bikur-bybit3; do systemctl is-enabled -q $s && systemctl start $s; done; sleep 5; for s in bikur-bybit bikur-bybit2 bikur-bybit3; do systemctl is-active $s | sed "s/^/$s: /"; done' ;;
          esac
