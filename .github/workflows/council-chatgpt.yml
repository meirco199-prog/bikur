# הצד של ChatGPT ב-AI Council, אוטומטי: פעם ביום (אחרי דוח התקינות) ChatGPT קורא את Issue #25 ואת נתוני הפלטפורמה דרך OpenAI API
# ומפרסם סקירה של "מהנדס שני" כתגובה בשם **ChatGPT**; ה-Routine של Claude (21:00 שעון ישראל) קוראת ועונה. ראה invest/docs/COUNCIL_RELAY.md.
# כבוי עד שבעל הריפו מגדיר OPENAI_API_KEY ב-Actions Secrets (זו ההרשאה להוצאה; אומדן: סנטים בודדים לריצה). דגם: repo variable OPENAI_MODEL.
name: AI Council ChatGPT (daily review → Issue #25)

on:
  schedule:
    # חוות דעת על פקודות הדמה לפני שהגשר שולח אותן (13:31 UTC): הסוכן מחליט בבוקר, ChatGPT קורא. שני חלונות כי GitHub מאחר בשעות;
    # הסקריפט מדלג אם כבר פורסמה סקירה היום. גם ביום שני: פקודות שהוחלטו בשבת נשלחות בשני (בקשת מאיר 29/9 — ChatGPT מעורב בכל עסקה)
    - cron: '17 7 * * 1-6'
    - cron: '0 9 * * 1-6'
  workflow_dispatch:
    inputs:
      force:
        description: 'לרוץ גם אם כבר פורסמה סקירה היום (1)'
        required: false
        default: '0'

permissions:
  contents: read
  issues: write

concurrency: council-chatgpt

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ChatGPT daily review → Issue #25
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING: ${{ vars.OPENAI_REASONING }}
          COUNCIL_FORCE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: https://invest-api.meirco199.workers.dev
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node invest-api/scripts/council-chatgpt.mjs
