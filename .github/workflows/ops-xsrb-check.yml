# זמני (ops): בדיקת בידוד — טביעת אצבע של המצב השמור של XSRA-7 המקורי (GET /xsra) ומצב מעקב 2 (GET /xsrb). קריאה בלבד.
name: ops-xsrb-check
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/ops-xsrb-check.yml]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: read
        run: |
          W=https://invest-api.meirco199.workers.dev
          curl -s "$W/xsra" > xsra.json; curl -s "$W/xsrb" > xsrb.json
          echo "xsra sha256: $(sha256sum xsra.json | cut -c1-16)"
          node -e 'const a=require("./xsra.json");console.log("xsra:",JSON.stringify({id:a?.id,startDay:a?.startDay,lastDay:a?.lastDay,receivedAt:a?.receivedAt,equity:a?.equity,daily:a?.daily?.length,changes:a?.changes?.length}));const b=require("./xsrb.json");console.log("xsrb:",JSON.stringify(b&&{id:b.id,startDay:b.startDay,lastDay:b.lastDay,startedAt:b.startedAt,receivedAt:b.receivedAt,equity:b.equity,daily:b.daily?.length,trades:b.trades?.length}))'
          curl -s -o /dev/null -w "page: %{http_code}\n" https://meirco199-prog.github.io/bikur/invest/xsrb.html
