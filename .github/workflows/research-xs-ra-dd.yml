# זמני (ops): אבחון הירידה של 52% במומנטום המשודרג (scripts/research-xs-ra-dd.mjs). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
name: research-xs-ra-dd
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-xs-ra-dd.yml]
permissions: { contents: write }
concurrency: { group: research-xs-ra-dd, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: xsra-data.json.gz, key: research-xsra-2016-2026-11-13-v1 }
      - name: data (אם המטמון לא זמין)
        run: '[ -f xsra-data.json.gz ] || node invest-api/scripts/research-xs-ra.mjs --data xsra-data.json.gz > /dev/null'
      - name: run
        run: |
          mkdir -p invest/docs/research/xs-ra-dd
          node invest-api/scripts/research-xs-ra-dd.mjs --data xsra-data.json.gz --out invest/docs/research/xs-ra-dd/report.md --json invest/docs/research/xs-ra-dd/results.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/xs-ra-dd
          git commit -m "ops: תוצאות אבחון הירידה של 52% (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
