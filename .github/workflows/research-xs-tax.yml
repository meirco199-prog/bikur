# זמני (ops): מודל מס רווחי הון 25% ל"3 המטבעות החזקים" (scripts/research-xs-tax.mjs). מחקר בלבד — אין כסף, אין פקודות, אין מפתחות.
# התוצאות נדחפות ל-invest/docs/research/xs-tax בענף שעליו רץ ה-workflow (לא ל-main).
name: research-xs-tax
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-xs-tax.yml]
permissions: { contents: write }
concurrency: { group: research-xs-tax, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: daily-data.json.gz, key: research-daily-2016-2026-11-07-v1 }
      - name: data (אם המטמון לא זמין)
        run: '[ -f daily-data.json.gz ] || node invest-api/scripts/research-daily.mjs --start 2016-01-01 --end 2026-11-07 --data daily-data.json.gz > /dev/null'
      - name: tests
        run: node --test invest-api/tests/research-daily.test.mjs
      - name: run
        run: |
          mkdir -p invest/docs/research/xs-tax
          node invest-api/scripts/research-xs-tax.mjs --data daily-data.json.gz --out invest/docs/research/xs-tax/report.md --json invest/docs/research/xs-tax/results.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/xs-tax
          git commit -m "ops: תוצאות מודל המס ל-3 המטבעות (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
