# מחקר שיטתי של 12 משפחות אסטרטגיות חתך (scripts/research-xsec.mjs, invest/docs/research/xsec/). מחקר בלבד — אין כסף, אין פקודות. (הרצה 4: קובץ ההרכב המעודכן עד 2026, נרמול שנתי ל-50,000$)
# הרצה: Actions → research-xsec → Run workflow (בחר ענף שאינו main). התוצאות (report.md, results.csv, yearly.csv,
# walkforward.json, meta.json) נשמרות כ-artifact ונדחפות לענף שעליו רץ ה-workflow (לא ל-main — שם רק artifact), כך שכל ריצה ניתנת לשחזור.
name: research-xsec
on:
  workflow_dispatch:
    inputs:
      dump:
        description: 'רק לשמור עמודי ויקיפדיה גולמיים (לפיתוח המפענח), בלי מחקר'
        type: boolean
        default: false
permissions: { contents: write }
concurrency: { group: research-xsec, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: dump wiki pages
        if: inputs.dump
        run: |
          mkdir -p invest/docs/research/xsec/_wiki
          for p in Nasdaq-100 List_of_NASDAQ-100_companies; do curl -sSL -A "bikur-research/1.0" "https://en.wikipedia.org/wiki/$p" -o "invest/docs/research/xsec/_wiki/$p.html"; done
          ls -la invest/docs/research/xsec/_wiki
      - name: research
        if: ${{ !inputs.dump }}
        run: node --max-old-space-size=6000 invest-api/scripts/research-xsec.mjs --outdir invest/docs/research/xsec
      - uses: actions/upload-artifact@v4
        with: { name: xsec-results, path: invest/docs/research/xsec }
      - name: commit results
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/xsec
          git commit -m "ops: תוצאות מחקר החתך (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
