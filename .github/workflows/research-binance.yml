# זמני (ops): המומנטום על Binance — אותו חישוב כמו ב-Bybit (7כו, 7כח) על רשימת המטבעות, תאריכי הרישום ועלויות ספר הפקודות של Binance.
# הרצה 2: אותו חישוב בלי ZEC — כמה מהתוצאה תלויה במטבע אחד.
# מחקר בלבד — אין כסף, אין פקודות, אין מפתחות; לא נוגע במעקב החי.
name: research-binance
on:
  push:
    branches: [claude/investment-research-platform-thffd8]
    paths: [.github/workflows/research-binance.yml]
permissions: { contents: write }
concurrency: { group: research-binance, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with: { path: xsra-data.json.gz, key: research-xsra-2016-2026-11-13-v1 }
      - name: data (אם המטמון לא זמין)
        run: '[ -f xsra-data.json.gz ] || node invest-api/scripts/research-xs-ra.mjs --data xsra-data.json.gz > /dev/null'
      - name: tests
        run: node --test invest-api/tests/xsra-paper.test.mjs invest-api/tests/xsra-protect.test.mjs
      - name: run
        run: |
          D=invest/docs/research/binance
          node --max-old-space-size=6000 invest-api/scripts/research-xsra-replay.mjs --venue "Binance בלי ZEC" --data xsra-data.json.gz --bybit $D/binance-probe-noZEC.json --out $D/report-replay-noZEC.md --json $D/results-replay-noZEC.json
          node --max-old-space-size=6000 invest-api/scripts/research-xsra-50k.mjs --venue "Binance בלי ZEC" --data xsra-data.json.gz --bybit $D/binance-probe-noZEC.json --out $D/report-50k-noZEC.md --json $D/results-50k-noZEC.json
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/docs/research/binance
          git commit -m "ops: תוצאות המומנטום על Binance בלי ZEC (ריצה ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
