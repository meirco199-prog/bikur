<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/layout.css" />

<script>
  // החלת ערכת הנושא לפני הציור הראשון — מונע הבהוב
  (function () {
    try {
      var raw = localStorage.getItem('bikur.finance.v1');
      var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
      if (theme === 'auto' || !theme) {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b0e18' : '#f5f6fa');
    } catch (e) { /* ברירת המחדל נשארת */ }
  })();
</script>
</head>
<body>

<div id="app">
  <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,#5d86fb,#2239a8);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800">₪</div>
    <div style="font-family:Heebo,system-ui,sans-serif;color:#7b839c;font-size:14px">טוען את הנתונים…</div>
  </div>
</div>

<div id="toasts"></div>

<noscript>
  <div style="padding:40px;text-align:center;font-family:system-ui">
    <h2>נדרש JavaScript</h2>
    <p>האפליקציה פועלת כולה בדפדפן ודורשת JavaScript מופעל.</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* עובד גם בלי */ });
    });
  }
</script>
</body>
</html>
