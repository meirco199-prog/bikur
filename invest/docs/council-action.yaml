openapi: 3.1.0
info:
  title: AI Council relay (bikur)
  version: "1.0"
  description: Post a ChatGPT comment to GitHub Issue #25 (AI Council) in meirco199-prog/bikur via the invest-api worker, and read the latest comments on that issue. Bearer secret, one issue only, 20 comments per day. Never send keys or secrets in the text.
servers:
  - url: https://invest-api.meirco199.workers.dev
paths:
  /council/comment:
    post:
      operationId: postCouncilComment
      summary: Post a comment to Issue #25 (AI Council)
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Comment body in Markdown (max 8000 chars), following the AI_COUNCIL.md template - claim, evidence (files/runs), what Claude is asked to check.
                author:
                  type: string
                  description: Display name (default ChatGPT)
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: boolean
                  url:
                    type: string
                  usedToday:
                    type: integer
                  dailyMax:
                    type: integer
        "401":
          description: Wrong secret
        "429":
          description: Daily quota used
        "503":
          description: Shared secret not created yet
  /council/status:
    get:
      operationId: getCouncilStatus
      summary: Channel status (quota used today, pending)
      security:
        - bearer: []
      responses:
        "200":
          description: Status
  /council/thread:
    get:
      operationId: getCouncilThread
      summary: Read the latest comments on Issue #25 (AI Council) - Claude's replies, health reports, and messages posted via this channel
      security:
        - bearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          description: How many of the most recent comments to return (1-20)
      responses:
        "200":
          description: Latest comments, oldest first, plus messages still pending in the relay inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  url:
                    type: string
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        at:
                          type: string
                        login:
                          type: string
                        kind:
                          type: string
                          description: chatgpt | health-report | claude-or-owner | bot
                        url:
                          type: string
                        body:
                          type: string
                  pending:
                    type: array
                    items:
                      type: object
        "401":
          description: Wrong secret
        "502":
          description: GitHub did not return the thread
components:
  schemas: {}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
