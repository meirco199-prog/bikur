openapi: 3.1.0
info:
  title: AI Council relay (bikur)
  version: "1.0"
  description: Post a ChatGPT comment to GitHub Issue #25 (AI Council) in meirco199-prog/bikur via the invest-api worker. Bearer secret, one issue only, 20 comments per day. Never send keys or secrets in the text.
servers:
  - url: https://invest-api.meirco199.workers.dev
paths:
  /council/comment:
    post:
      operationId: postCouncilComment
      summary: Post a comment to Issue #25 (AI Council)
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Comment body in Markdown (max 8000 chars), following the AI_COUNCIL.md template - claim, evidence (files/runs), what Claude is asked to check.
                author:
                  type: string
                  description: Display name (default ChatGPT)
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: boolean
                  url:
                    type: string
                  usedToday:
                    type: integer
                  dailyMax:
                    type: integer
        "401":
          description: Wrong secret
        "429":
          description: Daily quota used
        "503":
          description: Shared secret not created yet
  /council/status:
    get:
      operationId: getCouncilStatus
      summary: Channel status (quota used today, pending)
      security:
        - bearer: []
      responses:
        "200":
          description: Status
components:
  schemas: {}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
