<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עוזר המסחר</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--up:#0f8a4b;--down:#c0262d;--warn:#b45309;--acc:#2563eb}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--mute:#9aa3af;--line:#2a2f3a;--up:#34d399;--down:#f87171;--warn:#fbbf24;--acc:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:12px 12px 40px}
h1{font-size:18px;margin:4px 0 8px}h2{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.mute{color:var(--mute);font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.big{font-size:22px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:17px}.pill{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mute)}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:14px}
input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.btn{padding:10px 14px;border-radius:8px;border:0;background:var(--acc);color:#fff;font-size:15px}
.alert{border-right:4px solid var(--warn)}.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px}.tabs button{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.note{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<div class="row"><h1>עוזר המסחר</h1><span id="phase" class="pill">…</span></div>
<div class="kpis">
  <div class="kpi"><span class="mute">היום (הערכה)</span><b id="day">—</b></div>
  <div class="kpi"><span class="mute">חשיפה</span><b id="expo">—</b></div>
  <div class="kpi"><span class="mute">שווי (שני החשבונות)</span><b id="nav">—</b></div>
</div>
<div id="alerts"></div>
<div class="tabs" id="tabs">
  <button data-t="pos" class="on">מחזיק</button><button data-t="watch">במעקב</button><button data-t="calc">לפני קנייה</button><button data-t="news">חדשות ודוחות</button><button data-t="review">יומן וסיכומים</button>
</div>
<section id="t-pos"></section>
<section id="t-watch" hidden>
  <div class="card"><div class="row"><input id="wsym" placeholder="סימול, למשל NVDA" style="flex:1"><button class="btn" id="wadd">הוסף</button></div></div>
  <div id="wlist"></div>
</section>
<section id="t-calc" hidden>
  <div class="card">
    <div class="grid2"><label>סימול<input id="csym" placeholder="NVDA"></label><label>סוג<select id="ccls"><option value="day">מסחר יומי</option><option value="swing">סווינג</option></select></label>
    <label>מחיר כניסה (ריק = עכשיו)<input id="centry" inputmode="decimal"></label><label>הסטופ שלך (לא חובה)<input id="cstop" inputmode="decimal"></label></div>
    <div style="margin-top:10px"><button class="btn" id="cgo">בדוק</button></div>
  </div>
  <div id="cout"></div>
</section>
<section id="t-news" hidden><div id="earn"></div><div id="news"></div></section>
<section id="t-review" hidden><div id="reviews"></div><div id="audit"></div></section>
<p class="note">קריאה בלבד — המערכת לא מבצעת פקודות. סטופ, יעד וגודל הם כללי ניהול סיכון, לא איתות רווחי: לא הוכח יתרון סטטיסטי לאף שיטת כניסה.</p>
<script>
const $=(s)=>document.querySelector(s), esc=(x)=>String(x??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f$=(x)=>x==null||!isFinite(x)?'—':(x<0?'‎−':'+')+Math.abs(Math.round(x)).toLocaleString('en-US')+'$';
const fp=(x,d=2)=>x==null||!isFinite(x)?'—':Number(x).toFixed(d), pc=(x)=>x==null||!isFinite(x)?'—':(x*100>0?'+':'')+(x*100).toFixed(1)+'%';
const cls=(x)=>x==null?'':x<0?'down':x>0?'up':'';
const CL={day:'מסחר יומי',swing:'סווינג',long:'טווח ארוך'}, PH={closed:'הבורסה סגורה',pre:'מסחר מוקדם',regular:'מסחר רגיל',post:'מסחר מאוחר'};
let ST=null;
document.querySelectorAll('#tabs button').forEach((b)=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach((x)=>x.classList.toggle('on',x===b));document.querySelectorAll('section').forEach((s)=>s.hidden=s.id!=='t-'+b.dataset.t);});
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{credentials:'same-origin'});return r.json();}
async function load(){
  try{ST=await api('/api/state');}catch{ $('#phase').textContent='אין חיבור'; return; }
  const ph=ST.phase||{}; $('#phase').textContent=(PH[ph.phase]||'—')+(ph.half?' · יום מקוצר':'')+(ST.updated?' · '+new Date(ST.updated*1000).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'');
  const nav=Object.values(ST.navByAcct||{}).reduce((a,x)=>a+(x||0),0), expo=(ST.positions||[]).reduce((a,p)=>a+(p.last??p.avg??0)*p.qty,0);
  $('#day').innerHTML=`<span class="${cls(ST.dayPnl)}">${f$(ST.dayPnl)}</span>`; $('#nav').textContent=nav?Math.round(nav).toLocaleString('en-US')+'$':'—'; $('#expo').textContent=nav?Math.round(expo/nav*100)+'%':'—';
  $('#alerts').innerHTML=(ST.alerts||[]).map((a)=>`<div class="card alert">${esc(a)}</div>`).join('');
  if(!ST.configured?.flex?.length) $('#alerts').innerHTML+=`<div class="card alert">עדיין אין חיבור לחשבונות (מפתח Flex של IBKR). המחירים, המעקב והמחשבון כבר עובדים.</div>`;
  $('#t-pos').innerHTML=(ST.positions||[]).map((p)=>{const r=p.rec||{},ret=p.avg?p.last/p.avg-1:null,pk=p.avg&&p.peak?p.peak/p.avg-1:null;return `<div class="card">
    <div class="row"><b style="font-size:17px">${esc(p.sym)}</b><span class="pill">${esc(p.acctName)} · ${p.qty.toLocaleString('en-US')} מניות</span></div>
    <div class="row"><span class="big ${cls(p.pnl)}">${f$(p.pnl)}</span><span class="${cls(ret)}">${pc(ret)}</span></div>
    <div class="grid2"><span class="mute">עלות ממוצעת</span><span>${fp(p.avg)}</span><span class="mute">עכשיו</span><span>${fp(p.last)}</span>
    <span class="mute">שיא מאז הכניסה</span><span>${fp(p.peak)} (${pc(pk)})</span>
    <span class="mute">סטופ מומלץ</span><span class="down">${r.stop!=null?fp(r.stop):'—'}</span><span class="mute">יעד</span><span class="up">${r.target!=null?fp(r.target):'—'}</span>
    <span class="mute">גודל מומלץ</span><span>${r.shares!=null?r.shares.toLocaleString('en-US')+' מניות':'—'}</span></div>
    ${p.spike?`<div class="note warn">כניסה אחרי זינוק: ${esc(p.spike)}</div>`:''}<div class="note">${esc(r.note||'')}</div>
    <div class="seg">${['day','swing','long'].map((c)=>`<button class="${p.cls===c?'on':''}" onclick="setCls('${esc(p.acct)}','${esc(p.sym)}','${c}')">${CL[c]}</button>`).join('')}</div></div>`;}).join('')||'<div class="card mute">אין פוזיציות פתוחות (או שהחיבור לחשבונות עוד לא הוגדר).</div>';
  $('#wlist').innerHTML=(ST.watch||[]).map((w)=>`<div class="card"><div class="row"><b>${esc(w.sym)}</b><span class="${cls(w.chg)}">${fp(w.last)} · ${pc(w.chg)}</span></div>
    <div class="grid2"><span class="mute">מעל ממוצע 20 יום</span><span>${w.above20==null?'—':w.above20?'כן':'לא'}</span><span class="mute">ממוצע 20 עולה</span><span>${w.ma20Up==null?'—':w.ma20Up?'כן':'לא'}</span>
    <span class="mute">מעל ממוצע 50 יום</span><span>${w.above50==null?'—':w.above50?'כן':'לא'}</span><span class="mute">מחיר ממוצע היום</span><span>${fp(w.vwap)}</span></div>
    <div class="seg"><button onclick="calc('${esc(w.sym)}')">בדיקה לפני קנייה</button><button onclick="unwatch('${esc(w.sym)}')">הסר</button></div></div>`).join('');
  $('#earn').innerHTML='<h2>דוחות קרובים</h2>'+((ST.earnings||[]).map((e)=>`<div class="card row"><b>${esc(e.sym)}</b><span>${esc(e.date)} · ${esc(e.time)}</span></div>`).join('')||'<div class="card mute">אין דוחות בשבועיים הקרובים למניות שלך ובמעקב.</div>');
  $('#news').innerHTML='<h2>חדשות אחרונות</h2>'+(Object.entries(ST.news||{}).map(([s,a])=>a.map((n)=>`<div class="card"><span class="pill">${esc(s)}</span> ${/^https?:\/\//i.test(n.url||'')?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.h)}</a>`:esc(n.h)}<div class="mute">${new Date(n.t).toLocaleString('he-IL')}</div></div>`).join('')).join('')||'<div class="card mute">אין חדשות.</div>');
  $('#reviews').innerHTML='<h2>סיכומים יומיים · המלצות המערכת מול בפועל</h2>'+((ST.reviews||[]).slice().reverse().map((r)=>`<div class="card"><div class="row"><b>${esc(r.date)}</b><span class="${cls(r.pnl)}">${f$(r.pnl)} · ${r.trades} עסקאות</span></div>
    ${(r.mistakes||[]).map((m)=>`<div class="mute">• ${esc(m.name)}: ${m.n} (${f$(m.pnl)})</div>`).join('')}
    ${r.alt?`<table><tr><th>בפועל</th><th>המערכת</th><th>סוף יום</th><th>סטופ לכניסה +1%</th><th>נגרר 1.5%</th></tr><tr><td>${f$(r.alt.actual)}</td><td>${f$(r.alt.system)}</td><td>${f$(r.alt.eod)}</td><td>${f$(r.alt.be1)}</td><td>${f$(r.alt.trail15)}</td></tr></table>`:''}</div>`).join('')||'<div class="card mute">הסיכום הראשון יופיע אחרי סגירת המסחר.</div>');
  $('#audit').innerHTML='<h2>שינויי סיווג</h2>'+((ST.audit||[]).slice().reverse().map((a)=>`<div class="mute">${new Date(a.t*1000).toLocaleString('he-IL')} · ${esc(a.key.split('|')[1])}: ${CL[a.from]||'ברירת מחדל'} → ${CL[a.to]}</div>`).join('')||'<div class="mute">אין שינויים.</div>');
}
async function setCls(acct,sym,c){await api('/api/class',{acct,sym,cls:c});load();}
async function unwatch(s){await api('/api/watch',{sym:s,op:'del'});load();}
$('#wadd').onclick=async()=>{const s=$('#wsym').value.trim();if(!s)return;await api('/api/watch',{sym:s});$('#wsym').value='';load();};
function calc(s){$('#csym').value=s;document.querySelector('#tabs [data-t=calc]').click();$('#cgo').click();}
$('#cgo').onclick=async()=>{const sym=$('#csym').value.trim().toUpperCase();if(!sym)return;$('#cout').innerHTML='<div class="card mute">בודק…</div>';
  const r=await api('/api/calc',{sym,cls:$('#ccls').value,entry:$('#centry').value,stop:$('#cstop').value}),c=r.checks||{},rec=r.rec||{};
  const flags=[]; if(c.trend&&!c.trend.above20)flags.push('המניה מתחת לממוצע 20 יום (מגמת ירידה) — אצלך זה היה הדפוס היקר ביותר'); if(c.spike)flags.push('זינוק לפני הכניסה: '+c.spike); if(c.earnings)flags.push(`דוח קרוב: ${c.earnings.date} (${c.earnings.time})`);
  $('#cout').innerHTML=`<div class="card"><div class="row"><b>${esc(r.sym)}</b><span>כניסה ${fp(r.entry)}</span></div>
  <div class="grid2"><span class="mute">סטופ</span><span class="down">${fp(rec.stop)}</span><span class="mute">יעד</span><span class="up">${fp(rec.target)}</span>
  <span class="mute">גודל</span><span>${rec.shares!=null?rec.shares.toLocaleString('en-US')+' מניות':'—'}</span><span class="mute">הפסד מקסימלי</span><span>${f$(rec.maxLoss!=null?-rec.maxLoss:null)}</span>
  <span class="mute">מרחק מהמחיר הממוצע היום</span><span>${pc(c.vsVwap)}</span><span class="mute">מגמה</span><span>${c.trend?(c.trend.above20?'מעל 20':'מתחת ל-20')+' · '+(c.trend.above50?'מעל 50':'מתחת ל-50'):'—'}</span></div>
  ${flags.length?flags.map((f)=>`<div class="note warn">⚠️ ${esc(f)}</div>`).join(''):'<div class="note">אין דגלים אדומים מהרשימה.</div>'}
  <div class="note">${esc(rec.note||'')} · ${esc(r.disclaimer||'')}</div></div>`;};
load(); setInterval(load,20000);
</script>
</body>
</html>
