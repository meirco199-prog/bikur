<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>250 Years of Friendship — ניו־יורק · ירושלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0c0c0e;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    font-family:'Cormorant Garamond', serif;
  }
  .frame {
    width:100%; max-width:1100px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    border-radius:6px; overflow:hidden;
    background:#efe6d2;
  }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="גלויה: גשר ברוקלין בניו־יורק מחובר לירושלים — כיפת הזהב, הכותל וחומות העיר העתיקה, מתחת לגשר המיתרים">
  <defs>
    <!-- ====== Gradients ====== -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#aab8c2"/>
      <stop offset="0.35" stop-color="#d7cdb6"/>
      <stop offset="0.62" stop-color="#f2e3c4"/>
      <stop offset="0.80" stop-color="#fbf1da"/>
      <stop offset="1"    stop-color="#f6e7c8"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff8e6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffeecb" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffeecb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#cdd6cf"/>
      <stop offset="0.25" stop-color="#9fb2ad"/>
      <stop offset="1"    stop-color="#5d7672"/>
    </linearGradient>

    <linearGradient id="goldDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff0b0"/>
      <stop offset="0.35" stop-color="#f4c542"/>
      <stop offset="0.7" stop-color="#d49a1e"/>
      <stop offset="1"   stop-color="#a9760f"/>
    </linearGradient>
    <radialGradient id="goldShine" cx="0.35" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#fff2bf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff2bf" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stoneCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe2c6"/>
      <stop offset="1" stop-color="#cdb992"/>
    </linearGradient>
    <linearGradient id="stoneWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d3ac"/>
      <stop offset="1" stop-color="#bf9f6f"/>
    </linearGradient>
    <linearGradient id="kotel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8b4"/>
      <stop offset="1" stop-color="#b89a6a"/>
    </linearGradient>

    <linearGradient id="nyc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6ad" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6f7d84" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="mast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#c9d2d6"/>
    </linearGradient>

    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="haze"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="domeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============ SKY ============ -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#sky)"/>
  <ellipse cx="600" cy="250" rx="430" ry="300" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#fdf6e7" opacity="0.7" filter="url(#haze)">
    <ellipse cx="230" cy="120" rx="150" ry="26"/>
    <ellipse cx="350" cy="150" rx="120" ry="20"/>
    <ellipse cx="930" cy="110" rx="170" ry="28"/>
    <ellipse cx="1040" cy="150" rx="120" ry="20"/>
    <ellipse cx="600" cy="80"  rx="200" ry="22"/>
  </g>

  <!-- ============ LEFT: NEW YORK SKYLINE (distant) ============ -->
  <g filter="url(#soft)">
    <g fill="url(#nyc)">
      <rect x="120" y="360" width="26" height="120"/>
      <rect x="150" y="330" width="34" height="150"/>
      <rect x="188" y="372" width="22" height="108"/>
      <rect x="214" y="300" width="30" height="180"/>
      <!-- One World Trade -->
      <polygon points="250,478 258,250 266,250 274,478"/>
      <rect x="258" y="222" width="2" height="30"/>
      <rect x="280" y="350" width="40" height="130"/>
      <rect x="324" y="384" width="24" height="96"/>
      <rect x="352" y="340" width="30" height="140"/>
      <rect x="386" y="378" width="26" height="102"/>
      <rect x="416" y="356" width="34" height="124"/>
    </g>
  </g>

  <!-- ============ RIGHT: JERUSALEM (behind the bridge) ============ -->
  <g>
    <!-- far hills of the Old City -->
    <path d="M660,470 Q820,430 1000,452 Q1120,466 1200,448 L1200,520 L660,520 Z"
          fill="#d8c7a0" opacity="0.85" filter="url(#haze)"/>

    <!-- Old City wall with crenellations (merlons) -->
    <g>
      <rect x="660" y="436" width="540" height="56" fill="url(#stoneWarm)"/>
      <!-- merlons -->
      <g fill="url(#stoneWarm)">
        <rect x="664" y="424" width="18" height="14"/>
        <rect x="698" y="424" width="18" height="14"/>
        <rect x="732" y="424" width="18" height="14"/>
        <rect x="766" y="424" width="18" height="14"/>
        <rect x="800" y="424" width="18" height="14"/>
        <rect x="834" y="424" width="18" height="14"/>
        <rect x="868" y="424" width="18" height="14"/>
        <rect x="902" y="424" width="18" height="14"/>
        <rect x="936" y="424" width="18" height="14"/>
        <rect x="970" y="424" width="18" height="14"/>
        <rect x="1004" y="424" width="18" height="14"/>
        <rect x="1038" y="424" width="18" height="14"/>
        <rect x="1072" y="424" width="18" height="14"/>
        <rect x="1106" y="424" width="18" height="14"/>
        <rect x="1140" y="424" width="18" height="14"/>
        <rect x="1174" y="424" width="18" height="14"/>
      </g>
      <!-- stone courses -->
      <g stroke="#a98a5c" stroke-width="1" opacity="0.5">
        <line x1="660" y1="454" x2="1200" y2="454"/>
        <line x1="660" y1="472" x2="1200" y2="472"/>
      </g>
      <!-- city gate (Jaffa-style arch) -->
      <path d="M1018,492 L1018,462 Q1042,438 1066,462 L1066,492 Z" fill="#6b5836"/>
    </g>

    <!-- small white domes & cypress trees on the right -->
    <g>
      <path d="M700,436 q14,-24 28,0 z" fill="url(#stoneCool)"/>
      <path d="M1108,436 q12,-20 24,0 z" fill="url(#stoneCool)"/>
      <!-- cypress trees -->
      <g fill="#4a5b3a">
        <ellipse cx="780" cy="420" rx="8" ry="26"/>
        <ellipse cx="1158" cy="420" rx="7" ry="22"/>
        <ellipse cx="985" cy="416" rx="7" ry="24"/>
      </g>
    </g>

    <!-- ===== TOWER OF DAVID (citadel + minaret) ===== -->
    <g>
      <rect x="690" y="372" width="60" height="120" fill="url(#stoneWarm)"/>
      <g fill="url(#stoneWarm)">
        <rect x="690" y="362" width="13" height="12"/>
        <rect x="714" y="362" width="13" height="12"/>
        <rect x="738" y="362" width="12" height="12"/>
      </g>
      <!-- minaret -->
      <rect x="706" y="296" width="26" height="78" fill="url(#stoneCool)"/>
      <rect x="703" y="288" width="32" height="10" fill="url(#stoneCool)"/>
      <path d="M706,288 q13,-30 26,0 z" fill="#cdbb93"/>
      <circle cx="719" cy="252" r="5" fill="url(#goldDome)"/>
      <g stroke="#9c7f53" stroke-width="1" opacity="0.4">
        <line x1="690" y1="404" x2="750" y2="404"/>
        <line x1="690" y1="436" x2="750" y2="436"/>
        <line x1="690" y1="468" x2="750" y2="468"/>
      </g>
      <rect x="704" y="420" width="14" height="22" rx="7" fill="#6b5836"/>
    </g>

    <!-- ===== DOME OF THE ROCK (golden dome — centerpiece) ===== -->
    <g filter="url(#domeGlow)">
      <!-- octagonal drum -->
      <polygon points="800,492 800,398 822,378 884,378 906,398 906,492"
               fill="url(#stoneCool)"/>
      <!-- tilework band -->
      <rect x="800" y="392" width="106" height="30" fill="#7fa8c9" opacity="0.55"/>
      <g fill="#cdbb93">
        <rect x="812" y="426" width="14" height="40" rx="7"/>
        <rect x="846" y="426" width="14" height="40" rx="7"/>
        <rect x="880" y="426" width="14" height="40" rx="7"/>
      </g>
      <!-- gold drum ring -->
      <rect x="816" y="360" width="74" height="22" rx="4" fill="url(#goldDome)"/>
      <!-- golden dome -->
      <path d="M816,362 Q816,286 853,278 Q890,286 890,362 Z" fill="url(#goldDome)"/>
      <path d="M816,362 Q816,286 853,278 Q890,286 890,362 Z" fill="url(#goldShine)"/>
      <!-- finial + crescent -->
      <rect x="850" y="248" width="6" height="32" fill="#caa01e"/>
      <circle cx="853" cy="246" r="6" fill="#f4c542"/>
      <path d="M853,232 a10,10 0 1 0 7,18 a8,8 0 1 1 -7,-18 z" fill="#f4c542"/>
    </g>

    <!-- ===== THE WESTERN WALL (Kotel) — large ashlar plaza wall ===== -->
    <g>
      <rect x="726" y="468" width="330" height="54" fill="url(#kotel)"/>
      <!-- large herodian ashlar blocks with margins -->
      <g stroke="#9a7f52" stroke-width="1.4" opacity="0.7">
        <line x1="726" y1="486" x2="1056" y2="486"/>
        <line x1="726" y1="504" x2="1056" y2="504"/>
        <line x1="778" y1="468" x2="778" y2="486"/>
        <line x1="846" y1="468" x2="846" y2="486"/>
        <line x1="914" y1="468" x2="914" y2="486"/>
        <line x1="982" y1="468" x2="982" y2="486"/>
        <line x1="812" y1="486" x2="812" y2="504"/>
        <line x1="888" y1="486" x2="888" y2="504"/>
        <line x1="958" y1="486" x2="958" y2="504"/>
        <line x1="1018" y1="486" x2="1018" y2="504"/>
        <line x1="760" y1="504" x2="760" y2="522"/>
        <line x1="840" y1="504" x2="840" y2="522"/>
        <line x1="930" y1="504" x2="930" y2="522"/>
        <line x1="1010" y1="504" x2="1010" y2="522"/>
      </g>
      <!-- tufts of plants in the cracks -->
      <g fill="#6f8a4e" opacity="0.8">
        <path d="M812,486 q-3,-7 0,-9 q4,4 0,9z"/>
        <path d="M958,486 q3,-7 0,-9 q-4,4 0,9z"/>
      </g>
      <text x="730" y="464" font-family="Heebo, sans-serif" font-size="11" fill="#7a6238" opacity="0.85">הכותל המערבי</text>
    </g>
  </g>

  <!-- ============ WATER ============ -->
  <rect x="0" y="500" width="1200" height="220" fill="url(#water)"/>
  <g stroke="#eef3ee" stroke-width="2" opacity="0.35">
    <line x1="120" y1="540" x2="300" y2="540"/>
    <line x1="520" y1="560" x2="760" y2="560"/>
    <line x1="850" y1="600" x2="1080" y2="600"/>
    <line x1="200" y1="640" x2="480" y2="640"/>
  </g>
  <!-- sun reflection -->
  <ellipse cx="600" cy="560" rx="120" ry="40" fill="#fff3d6" opacity="0.45" filter="url(#haze)"/>

  <!-- sailboats -->
  <g fill="#fbf7ec" stroke="#9aa8a2" stroke-width="1">
    <g transform="translate(470,548)"><path d="M0,0 L20,0 L10,-34 Z"/><rect x="2" y="0" width="20" height="5" rx="2"/></g>
    <g transform="translate(540,576)"><path d="M0,0 L16,0 L8,-26 Z"/><rect x="0" y="0" width="18" height="4" rx="2"/></g>
  </g>

  <!-- ============ LEFT BRIDGE: BROOKLYN (front) ============ -->
  <g>
    <!-- deck -->
    <path d="M0,470 Q170,452 330,486 L330,500 Q170,468 0,486 Z" fill="#5a534a"/>
    <!-- two gothic stone towers -->
    <g fill="#7c6f5d">
      <rect x="56" y="250" width="56" height="248"/>
      <rect x="150" y="262" width="56" height="236"/>
    </g>
    <g fill="#5f5446">
      <!-- gothic arch openings -->
      <path d="M64,372 h16 v-34 a8,8 0 0 0 -16,0 z"/>
      <path d="M88,372 h16 v-34 a8,8 0 0 0 -16,0 z"/>
      <path d="M158,380 h16 v-32 a8,8 0 0 0 -16,0 z"/>
      <path d="M182,380 h16 v-32 a8,8 0 0 0 -16,0 z"/>
    </g>
    <!-- cables -->
    <g stroke="#3f3a33" stroke-width="1.4" fill="none" opacity="0.9">
      <path d="M84,250 Q20,360 0,440"/>
      <path d="M84,250 Q150,330 178,262"/>
      <path d="M178,262 Q260,330 330,470"/>
    </g>
    <g stroke="#4a4439" stroke-width="0.8" opacity="0.7">
      <line x1="40" y1="408" x2="40" y2="472"/>
      <line x1="70" y1="392" x2="70" y2="476"/>
      <line x1="120" y1="306" x2="120" y2="480"/>
      <line x1="230" y1="350" x2="230" y2="486"/>
      <line x1="270" y1="396" x2="270" y2="490"/>
      <line x1="300" y1="432" x2="300" y2="494"/>
    </g>
  </g>

  <!-- ============ RIGHT BRIDGE: CHORDS / STRING BRIDGE (front) ============ -->
  <g>
    <!-- deck -->
    <path d="M1200,500 Q980,470 760,520 L760,534 Q980,484 1200,514 Z" fill="#6a6f72"/>
    <!-- leaning white mast -->
    <polygon points="1066,500 1078,500 1010,150 1004,150" fill="url(#mast)"/>
    <!-- harp cables -->
    <g stroke="#e7edf0" stroke-width="1.3" opacity="0.95">
      <line x1="1007" y1="170" x2="800" y2="516"/>
      <line x1="1007" y1="195" x2="838" y2="512"/>
      <line x1="1007" y1="220" x2="876" y2="508"/>
      <line x1="1007" y1="245" x2="914" y2="505"/>
      <line x1="1007" y1="270" x2="952" y2="502"/>
      <line x1="1007" y1="295" x2="990" y2="500"/>
      <line x1="1009" y1="320" x2="1030" y2="500"/>
      <line x1="1009" y1="345" x2="1066" y2="500"/>
      <line x1="1009" y1="370" x2="1100" y2="502"/>
      <line x1="1009" y1="395" x2="1140" y2="505"/>
    </g>
    <!-- mast cap -->
    <circle cx="1006" cy="150" r="5" fill="#ffffff"/>
  </g>

  <!-- ============ FLAGS ============ -->
  <!-- USA flag (left) -->
  <g transform="translate(84,250)">
    <rect x="-1" y="-86" width="2.5" height="86" fill="#6b6258"/>
    <g>
      <rect x="2" y="-86" width="58" height="34" fill="#f4f1ea"/>
      <g fill="#c4302b"><rect x="2" y="-86" width="58" height="5"/><rect x="2" y="-76" width="58" height="5"/><rect x="2" y="-66" width="58" height="5"/><rect x="2" y="-56" width="58" height="5"/></g>
      <rect x="2" y="-86" width="26" height="19" fill="#2a3b6b"/>
    </g>
  </g>
  <!-- Israel flag (right) -->
  <g transform="translate(1006,150)">
    <rect x="-1" y="-70" width="2.5" height="70" fill="#9aa3a8"/>
    <rect x="2" y="-70" width="60" height="36" fill="#f7f9fb"/>
    <rect x="2" y="-70" width="60" height="6" fill="#0a4ea2"/>
    <rect x="2" y="-40" width="60" height="6" fill="#0a4ea2"/>
    <g transform="translate(32,-52)" stroke="#0a4ea2" stroke-width="2" fill="none">
      <polygon points="0,-8 7,5 -7,5"/><polygon points="0,8 7,-5 -7,-5"/>
    </g>
  </g>

  <!-- ============ TOP TEXT ============ -->
  <g text-anchor="middle" fill="#6b5a3a">
    <text x="600" y="70"  font-size="26" letter-spacing="4" font-weight="600">BUILT FROM OUR DIFFERENCES.</text>
    <text x="600" y="104" font-size="26" letter-spacing="4" font-weight="600">STRONG IN OUR CONNECTION.</text>
    <text x="600" y="140" font-size="15" letter-spacing="6" fill="#9a7f52">SINCE <tspan fill="#b03a2e" font-weight="700">1776</tspan></text>
  </g>

  <!-- ============ COMMEMORATIVE STAMP ============ -->
  <g transform="translate(470,560)">
    <rect x="0" y="0" width="200" height="150" rx="4" fill="#f5ecd6" stroke="#caa35a" stroke-width="2"/>
    <rect x="8" y="8" width="184" height="134" rx="2" fill="none" stroke="#d8c79a" stroke-width="1"/>
    <text x="100" y="64" text-anchor="middle" font-size="56" font-weight="700" fill="#b03a2e">250</text>
    <text x="100" y="86" text-anchor="middle" font-size="13" letter-spacing="3" fill="#7a6238">YEARS OF FRIENDSHIP</text>
    <line x1="40" y1="98" x2="160" y2="98" stroke="#caa35a" stroke-width="1"/>
    <text x="100" y="116" text-anchor="middle" font-size="11" letter-spacing="2" fill="#8a7048">SHARED VALUES.</text>
    <text x="100" y="132" text-anchor="middle" font-size="11" letter-spacing="2" fill="#8a7048">SHARED FUTURE.</text>
  </g>

  <!-- postmark -->
  <g transform="translate(690,612)" stroke="#9a7f52" fill="none" opacity="0.8">
    <circle cx="36" cy="36" r="34" stroke-width="2"/>
    <circle cx="36" cy="36" r="20" stroke-width="1"/>
    <text x="36" y="20" text-anchor="middle" font-size="9" fill="#9a7f52" stroke="none">1776</text>
    <text x="36" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#9a7f52" stroke="none">250</text>
    <text x="36" y="58" text-anchor="middle" font-size="9" fill="#9a7f52" stroke="none">2026</text>
  </g>

  <!-- ============ VINTAGE BORDER ============ -->
  <rect x="6" y="6" width="1188" height="788" rx="6" fill="none" stroke="#cdbf9c" stroke-width="3" opacity="0.7"/>
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#000" stroke-opacity="0.04" stroke-width="14"/>
</svg>
</div>
</body>
</html>
