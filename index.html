<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#16a34a" />
<title>יומן אוכל משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f0fdf4;
    --card:#ffffff;
    --ink:#14532d;
    --ink2:#166534;
    --muted:#6b7280;
    --green:#16a34a;
    --green-soft:#dcfce7;
    --red:#dc2626;
    --red-soft:#fee2e2;
    --amber:#f59e0b;
    --amber-soft:#fef3c7;
    --blue:#0ea5e9;
    --blue-soft:#e0f2fe;
    --violet:#7c3aed;
    --violet-soft:#ede9fe;
    --border:#e5e7eb;
    --radius:18px;
    --shadow:0 4px 18px rgba(20,83,45,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Heebo',sans-serif;
    background:linear-gradient(180deg,#ecfdf5 0%,#f0fdf4 40%,#f7fee7 100%);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 90px}
  h1{font-size:22px;font-weight:900}
  h2{font-size:18px;font-weight:800}
  h3{font-size:16px;font-weight:700}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:14px;border:1px solid rgba(22,101,52,.06);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:14px;padding:12px 18px;font-family:inherit;
    font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s;
    background:var(--green);color:#fff;
  }
  .btn:active{transform:scale(.97)}
  .btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--border)}
  .btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
  .btn.danger{background:var(--red)}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  input,select{
    font-family:inherit;font-size:16px;padding:12px;border:2px solid var(--border);
    border-radius:12px;width:100%;background:#fff;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--green)}
  .row{display:flex;gap:10px;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  .center{text-align:center}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 2px 14px;gap:8px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);
    color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;
  }
  .banner{
    border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;font-weight:700;
    display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.45;
  }
  .banner.cheat{background:linear-gradient(135deg,#fdf4ff,#fae8ff);color:#86198f;border:1px solid #f0abfc}
  .banner.warn{background:var(--red-soft);color:var(--red);border:1px solid #fecaca}
  .banner.info{background:var(--blue-soft);color:#075985;border:1px solid #bae6fd}
  .banner.weigh{background:var(--amber-soft);color:#92400e;border:1px solid #fde68a}
  .meal{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:#fff}
  .meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .meal-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .meal-hint{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .water{
    display:flex;align-items:center;gap:6px;background:var(--blue-soft);
    border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600;color:#075985;flex-wrap:wrap;
  }
  .cup{
    font-size:22px;background:none;border:none;cursor:pointer;filter:grayscale(1);opacity:.45;transition:.15s;
  }
  .cup.on{filter:none;opacity:1;transform:scale(1.1)}
  .fooditem{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
    margin-bottom:7px;font-weight:600;font-size:15px;
  }
  .fooditem.ok{background:var(--green-soft);color:var(--ink2)}
  .fooditem.bad{background:var(--red-soft);color:var(--red)}
  .fooditem.cheat{background:var(--violet-soft);color:var(--violet)}
  .fooditem .mark{font-size:18px;font-weight:900}
  .fooditem .why{font-size:12px;font-weight:500;opacity:.85}
  .fooditem .del{
    margin-inline-start:auto;background:none;border:none;cursor:pointer;
    color:inherit;opacity:.5;font-size:16px;padding:4px;
  }
  .addrow{display:flex;gap:8px;margin-top:8px}
  .addrow input{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{
    background:#f3f4f6;border:1px solid var(--border);border-radius:999px;
    padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);
  }
  .chip:active{background:var(--green-soft)}
  .usergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .userbtn{
    background:#fff;border:2px solid var(--border);border-radius:var(--radius);
    padding:18px 10px;text-align:center;cursor:pointer;font-family:inherit;
  }
  .userbtn .emoji{font-size:34px;display:block;margin-bottom:6px}
  .userbtn .name{font-size:16px;font-weight:800;color:var(--ink)}
  .userbtn:active{border-color:var(--green)}
  .codeinput{letter-spacing:12px;text-align:center;font-size:26px;font-weight:800;direction:ltr}
  .rule{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--border);font-size:15px;line-height:1.55}
  .rule:last-child{border-bottom:none}
  .rule .ic{font-size:20px;flex-shrink:0}
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:8px 0 max(10px,env(safe-area-inset-bottom));z-index:40;
  }
  .tab{
    background:none;border:none;font-family:inherit;cursor:pointer;text-align:center;
    color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center;
  }
  .tab .ic{font-size:22px}
  .tab.on{color:var(--green)}
  .kidsec{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:#fff}
  .kidsec-head{
    display:flex;justify-content:space-between;align-items:center;padding:13px 14px;
    background:#f9fafb;cursor:pointer;gap:8px;
  }
  .daybox{padding:10px 14px;border-top:1px dashed var(--border)}
  .daybox h4{font-size:14px;font-weight:800;margin-bottom:6px}
  .mini{font-size:14px;padding:6px 10px;margin-bottom:5px}
  .weightrow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--border);font-size:14px;font-weight:600}
  .weightrow:last-child{border-bottom:none}
  .sync{
    position:fixed;top:8px;left:8px;z-index:60;font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:999px;background:var(--amber-soft);color:#92400e;display:none;
  }
  .sync.show{display:block}
  .codechip{background:#111827;color:#fff;border-radius:8px;padding:3px 10px;font-weight:800;letter-spacing:2px;direction:ltr;display:inline-block}
  svg.chart{width:100%;height:130px;display:block}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="sync" id="syncBadge">⏳ מסנכרן…</div>
<div class="wrap" id="app"></div>

<script>
/* ================= יומן אוכל משפחתי =================
   רישום ארוחות (בלי ספירת קלוריות) + חוקים + סנכרון משפחתי.
   סנכרון: JSON משותף בענן (jsonblob.com) — כל המשתמשים רואים הכל.
====================================================== */

const API = 'https://jsonblob.com/api/jsonBlob';
const POLL_MS = 15000;

/* ---------- תפריט וחוקים ---------- */
const MEALS = [
  {key:'breakfast', name:'ארוחת בוקר',  emoji:'🍳', hint:'עדיפות לחלבון: חביתה / טונה / קוטג׳ — עם פיתה או לחמנייה',
   chips:['חביתה','טונה','קוטג׳','פיתה','לחמנייה','ירקות']},
  {key:'lunch',     name:'ארוחת צהריים', emoji:'🍗', hint:'אוכלים טוב! בלי תוספות שמנות כמו צ׳יפס וכדומה',
   chips:['עוף','אורז','פסטה','קציצות','תפוח אדמה','סלט']},
  {key:'snack',     name:'ארוחת ביניים', emoji:'🍎', hint:'חטיף בריאות או פרי — עדיפות לפירות!',
   chips:['תפוח','בננה','אבטיח','ענבים','חטיף בריאות']},
  {key:'dinner',    name:'ארוחת ערב',   emoji:'🥗', hint:'עד 19:00 בלבד! חלבון בלבד: ביצים / טונה / סלט',
   chips:['ביצים','חביתה','טונה','סלט','קוטג׳']},
];

const RULES = [
  ['💧','לפני כל ארוחה שותים כוס מים — עדיף 2 כוסות!'],
  ['🚫','לא אוכלים אחרי השעה 19:00 בערב!!!'],
  ['🍳','ארוחת בוקר: עדיפות לחלבון — חביתה, טונה או קוטג׳, עם פיתה או לחמנייה.'],
  ['🍗','צהריים: אוכלים טוב. בלי תוספות שמנות כמו צ׳יפס וכדומה.'],
  ['🍎','ארוחת ביניים (בין צהריים לערב): חטיף בריאות או פרי — עדיפות לפירות.'],
  ['🥗','ארוחת ערב: עד השעה 19:00, וחלבון בלבד — ביצים, טונה, סלט.'],
  ['⚖️','שקילה פעם בשבוע.'],
  ['🎉','יום צ׳יט אחד בשבוע — יום שישי!'],
  ['🎂','יש אירוע או יום הולדת? אוכלים בצהריים את ארוחת הערב.'],
];

/* מילות מפתח לבדיקת התפריט. ההתאמה לפי "הטקסט מכיל". */
const DINNER_OK = ['ביצה','ביצים','ביצת','חביתה','חביתת','טונה','סלט','ירקות','קוטג','גבינה','מלפפון','עגבני'];
const BREAKFAST_OK = [...DINNER_OK,'פיתה','לחמניה','לחמנייה','לחם','אבוקדו','יוגורט'];
const SNACK_OK = ['פרי','פירות','תפוח','בננה','אגס','אבטיח','מלון','ענבים','אפרסק','נקטרינה','שזיף','תות','מנגו','קלמנטינה','תפוז','מנדרינה','רימון','אננס','קיווי','אפרסמון','גזר','מלפפון','חטיף בריאות','חטיף דגנים','חטיף חלבון'];
const FRUITS = ['פרי','פירות','תפוח','בננה','אבטיח','ענבים','מלון','אגס','אפרסק','תות','מנגו','שזיף','קלמנטינה','תפוז'];
const JUNK = ['ציפס','ציפס','בורקס','מטוגן','שוקולד','עוגה','עוגיה','עוגיות','עוגיי','גלידה','ממתק','סוכריה','סוכריות','במבה','ביסלי','דוריטוס','ציטוס','קולה','שתיה מתוקה','משקה מתוק','מאפה','מלאווח','גחנון','סופגניה','סופגניות','פיצה','נקניקיה','נקניקיות','וופל','חטיף מלוח','שווארמה בלאפה','קרואסון','דונאט'];

function norm(t){
  return (t||'').replace(/['"׳״`]/g,'').replace(/\s+/g,' ').trim();
}
function hasAny(text, list){
  const n = norm(text);
  return list.some(w => n.includes(norm(w)));
}

/* בדיקת פריט: מחזיר {status:'ok'|'bad'|'cheat', why} */
function checkFood(mealKey, text, {cheat=false, late=false, eventLunch=false}={}){
  if (cheat) return {status:'cheat', why:'יום צ׳יט — הכל מותר 🎉'};
  if (mealKey==='dinner' && late) return {status:'bad', why:'אחרי 19:00 — לא אוכלים!'};
  const asDinner = mealKey==='dinner' || (mealKey==='lunch' && eventLunch);
  if (asDinner){
    if (hasAny(text, JUNK)) return {status:'bad', why:'לא בתפריט ערב'};
    if (hasAny(text, DINNER_OK)) return {status:'ok', why:'חלבון — מעולה!'};
    return {status:'bad', why:'בערב חלבון בלבד: ביצים / טונה / סלט'};
  }
  if (mealKey==='breakfast'){
    if (hasAny(text, JUNK)) return {status:'bad', why:'לא בתפריט הבוקר'};
    if (hasAny(text, BREAKFAST_OK)) return {status:'ok', why:'לפי התפריט!'};
    return {status:'bad', why:'לא בתפריט — עדיף חלבון עם פיתה/לחמנייה'};
  }
  if (mealKey==='lunch'){
    if (hasAny(text, JUNK)) return {status:'bad', why:'תוספת שמנה / לא בריא'};
    return {status:'ok', why:'בתיאבון!'};
  }
  if (mealKey==='snack'){
    if (hasAny(text, JUNK)) return {status:'bad', why:'לא בתפריט'};
    if (hasAny(text, SNACK_OK)) return {status:'ok', why: hasAny(text,FRUITS)?'פרי — הכי טוב!':'חטיף בריאות — סבבה'};
    return {status:'bad', why:'רק פרי או חטיף בריאות'};
  }
  return {status:'ok', why:''};
}

/* ---------- עזרי תאריך ---------- */
function todayKey(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isFriday(d=new Date()){ return d.getDay()===5; }
function after19(d=new Date()){ return d.getHours()>=19; }
function hebDate(d=new Date()){
  return new Intl.DateTimeFormat('he-IL',{weekday:'long', day:'numeric', month:'long'}).format(d);
}
function hebDateShort(key){
  const [y,m,dd]=key.split('-').map(Number);
  const d=new Date(y,m-1,dd);
  return new Intl.DateTimeFormat('he-IL',{weekday:'short', day:'numeric', month:'numeric'}).format(d);
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

/* ---------- מצב ---------- */
let DATA = null;
let familyId = localStorage.getItem('fam.id') || null;
let currentUserId = localStorage.getItem('fam.user') || null;
let view = 'today';
let dirty = false;
let syncing = false;
let pollTimer = null;

function emptyData(name){
  return {
    familyName: name||'המשפחה שלנו',
    parent: {name:'הורה', code: randCode(), codeTs: Date.now()},
    kids: [],
    logs: {},
    weights: {},
    updatedAt: Date.now()
  };
}
function randCode(){ return String(Math.floor(1000+Math.random()*9000)); }

/* ---------- סנכרון ---------- */
function showSync(txt){
  const b=document.getElementById('syncBadge');
  if(!txt){ b.classList.remove('show'); return; }
  b.textContent=txt; b.classList.add('show');
}

async function apiCreate(data){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error('create failed '+r.status);
  const loc = r.headers.get('Location') || r.headers.get('X-jsonblob') || '';
  const id = loc.split('/').filter(Boolean).pop();
  if(!id) throw new Error('no blob id');
  return id;
}
async function apiGet(id){
  const r = await fetch(API+'/'+id,{headers:{'Accept':'application/json'},cache:'no-store'});
  if(!r.ok) throw new Error('get failed '+r.status);
  return r.json();
}
async function apiPut(id,data){
  const r = await fetch(API+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error('put failed '+r.status);
  return data;
}

/* מיזוג בין הגרסה בענן לגרסה המקומית, לפי חותמות זמן */
function mergeData(a,b){
  if(!a) return b; if(!b) return a;
  const [x,y]=[a,b];
  const out = {familyName: x.updatedAt>=y.updatedAt?x.familyName:y.familyName};
  out.parent = (x.parent?.codeTs||0) >= (y.parent?.codeTs||0) ? {...x.parent} : {...y.parent};
  const kidMap = {};
  [...(x.kids||[]),...(y.kids||[])].forEach(k=>{
    const ex = kidMap[k.id];
    if(!ex || (k.codeTs||0)>(ex.codeTs||0)) kidMap[k.id]={...ex,...k};
  });
  // ילד שהוסר (קיים רק בצד אחד ויש לו tombstone) — מכבדים הסרה
  const removed = new Set([...(x.removedKids||[]),...(y.removedKids||[])]);
  out.removedKids = [...removed];
  out.kids = Object.values(kidMap).filter(k=>!removed.has(k.id));
  out.logs = {};
  const kidIds = new Set([...Object.keys(x.logs||{}),...Object.keys(y.logs||{})]);
  kidIds.forEach(kid=>{
    out.logs[kid]={};
    const days = new Set([...Object.keys(x.logs?.[kid]||{}),...Object.keys(y.logs?.[kid]||{})]);
    days.forEach(day=>{
      const da=x.logs?.[kid]?.[day], db=y.logs?.[kid]?.[day];
      if(!da){ out.logs[kid][day]=db; return; }
      if(!db){ out.logs[kid][day]=da; return; }
      const d={event:(da.eventTs||0)>=(db.eventTs||0)?da.event:db.event,
               eventTs:Math.max(da.eventTs||0,db.eventTs||0), meals:{}};
      MEALS.forEach(m=>{
        const ma=da.meals?.[m.key], mb=db.meals?.[m.key];
        if(!ma && !mb) return;
        const items={};
        [...(ma?.items||[]),...(mb?.items||[])].forEach(it=>{
          const ex=items[it.id];
          if(!ex || (it.ts||0)>(ex.ts||0)) items[it.id]=it;
        });
        d.meals[m.key]={
          water: (ma?.waterTs||0)>=(mb?.waterTs||0)?(ma?.water||0):(mb?.water||0),
          waterTs: Math.max(ma?.waterTs||0, mb?.waterTs||0),
          items: Object.values(items).sort((p,q)=>(p.ts||0)-(q.ts||0)),
        };
      });
      out.logs[kid][day]=d;
    });
  });
  out.weights={};
  const wIds=new Set([...Object.keys(x.weights||{}),...Object.keys(y.weights||{})]);
  wIds.forEach(kid=>{
    out.weights[kid]={};
    const weeks=new Set([...Object.keys(x.weights?.[kid]||{}),...Object.keys(y.weights?.[kid]||{})]);
    weeks.forEach(w=>{
      const wa=x.weights?.[kid]?.[w], wb=y.weights?.[kid]?.[w];
      out.weights[kid][w] = !wa?wb : !wb?wa : ((wa.ts||0)>=(wb.ts||0)?wa:wb);
    });
  });
  out.updatedAt = Math.max(x.updatedAt||0, y.updatedAt||0);
  return out;
}

let syncQueued=false;
function queueSync(){
  dirty=true;
  localStorage.setItem('fam.cache', JSON.stringify(DATA));
  if(syncQueued) return;
  syncQueued=true;
  setTimeout(()=>{syncQueued=false; syncNow();}, 900);
}
async function syncNow(){
  if(!familyId || syncing) return;
  syncing=true; showSync('⏳ מסנכרן…');
  try{
    const remote = await apiGet(familyId);
    const merged = mergeData(remote, DATA);
    if(dirty){
      merged.updatedAt = Date.now();
      await apiPut(familyId, merged);
      dirty=false;
    }
    DATA = merged;
    localStorage.setItem('fam.cache', JSON.stringify(DATA));
    showSync('');
    render();
  }catch(e){
    showSync('📴 אין חיבור — יסתנכרן אוטומטית');
  }finally{ syncing=false; }
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{ if(!document.hidden) syncNow(); }, POLL_MS);
}

/* ---------- עזרי נתונים ---------- */
function getDay(kidId, dayKey, create){
  DATA.logs[kidId] = DATA.logs[kidId]||{};
  if(!DATA.logs[kidId][dayKey] && create){
    DATA.logs[kidId][dayKey]={event:false,eventTs:0,meals:{}};
  }
  return DATA.logs[kidId][dayKey];
}
function getMeal(day, key, create){
  if(!day.meals[key] && create) day.meals[key]={water:0,waterTs:0,items:[]};
  return day.meals[key];
}
function weekKey(d=new Date()){
  const t=new Date(d); t.setDate(t.getDate()-t.getDay());
  return todayKey(t);
}
function kidById(id){ return (DATA.kids||[]).find(k=>k.id===id); }
function lastWeight(kidId){
  const arr=weightList(kidId);
  return arr[arr.length-1]||null;
}
function weightList(kidId){
  const w=DATA.weights?.[kidId]||{};
  return Object.values(w).filter(e=>!e.del).sort((a,b)=>a.date<b.date?-1:1);
}

function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content; }
function esc(s){ return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function render(){
  if(!familyId){ renderStart(); renderTabs(); return; }
  if(!DATA){ renderLoading(); return; }
  if(!currentUserId){ renderUserPick(); renderTabs(); return; }

  if(view==='weight') renderWeight();

}

async function joinFamily(){

  showSync('⏳ מתחבר…');
  try{

    if(!d || !d.parent) throw new Error('bad');
    familyId=code; DATA=d;
    localStorage.setItem('fam.id',familyId);

function renderToday(){

  const late=after19();
  const ev=!!day.event;

  let banners='';
  if(cheat) banners+=`<div class="banner cheat">🎉 יום שישי — יום צ׳יט! היום הכל מותר 😎</div>`;
  if(ev && !cheat) banners+=`<div class="banner info">🎂 יום אירוע: בצהריים אוכלים את ארוחת הערב (חלבון), ובערב — האירוע!</div>`;
  if(late && !cheat) banners+=`<div class="banner warn">🚫 השעה אחרי 19:00 — לא אוכלים יותר היום!</div>`;

  const lw=lastWeight(currentUserId);
  const needWeigh = !lw || (Date.now()-new Date(lw.date).getTime()) > 7*24*3600*1000;
  if(needWeigh) banners+=`<div class="banner weigh" onclick="setView('weight')" style="cursor:pointer">⚖️ הגיע הזמן לשקילה השבועית! לחצו כאן</div>`;

  const mealsHtml = MEALS.map(m=>{
    const isEventLunch = ev && m.key==='lunch' && !cheat;
    const isEventDinner = ev && m.key==='dinner' && !cheat;
    const meal=getMeal(day,m.key,false)||{water:0,items:[]};
    const items=(meal.items||[]).filter(i=>!i.del);
    const title = isEventLunch ? 'ארוחת צהריים 🎂 (אוכלים בה את ארוחת הערב)' :
                  isEventDinner ? 'ערב — האירוע 🎉' : m.name;
    const hint = isEventLunch ? 'יום אירוע: בצהריים אוכלים חלבון כמו בערב — ביצים / טונה / סלט' :
                 isEventDinner ? 'בתיאבון באירוע! מחר חוזרים לתפריט 💪' : m.hint;
    const itemsHtml = items.map(it=>{
      const cls = it.status==='ok'?'ok': it.status==='cheat'?'cheat':'bad';
      const mark = it.status==='ok'?'✓': it.status==='cheat'?'🎉':'✗';
      return `<div class="fooditem ${cls}">
        <span class="mark">${mark}</span>
        <span>${esc(it.text)}${it.why?` <span class="why">· ${esc(it.why)}</span>`:''}</span>
        <button class="del" onclick="delItem('${m.key}','${it.id}')" title="מחיקה">🗑</button>
      </div>`;
    }).join('');
    const chipList = isEventLunch ? MEALS.find(mm=>mm.key==='dinner').chips : m.chips;
    const chips = chipList.map(c=>
      `<span class="chip" onclick="addFood('${m.key}','${esc(c)}')">+ ${esc(c)}</span>`).join('');
    return `
    <div class="meal">
      <div class="meal-head">
        <div class="meal-title">${m.emoji} ${title}</div>
      </div>
      <div class="meal-hint">${hint}</div>
      <div class="water">
        💧 מים לפני האוכל:
        <button class="cup ${meal.water>=1?'on':''}" onclick="setWater('${m.key}',${meal.water>=1?0:1})">🥤</button>
        <button class="cup ${meal.water>=2?'on':''}" onclick="setWater('${m.key}',${meal.water>=2?1:2})">🥤</button>
        <span class="muted" style="font-size:11px">(עדיף 2 כוסות)</span>
      </div>
      ${itemsHtml}
      <div class="addrow">
        <input id="inp-${m.key}" placeholder="מה אכלת? (למשל: חביתה ופיתה)" onkeydown="if(event.key==='Enter')addFromInput('${m.key}')" />
        <button class="btn small" onclick="addFromInput('${m.key}')">הוספה</button>
      </div>
      <div class="chips">${chips}</div>
    </div>`;
  }).join('');

  app.innerHTML=`
  <div class="fade">
    <div class="topbar">
      <div>
        <h1>שלום ${esc(kid.name)} ${kid.emoji||''}</h1>
        <p class="muted">${hebDate()}</p>
      </div>
      <span class="badge">${esc(DATA.familyName)}</span>

      <input type="checkbox" style="width:22px;height:22px;flex-shrink:0" ${ev?'checked':''} onchange="toggleEvent(this.checked)" />
      <div><b>🎂 יש היום אירוע / יום הולדת</b><div class="muted">אם מסמנים — בצהריים אוכלים את ארוחת הערב</div></div>
    </label>
    ${mealsHtml}
  </div>`;
}

function addFromInput(mealKey){

function addFood(mealKey,text){
  text=norm(text);
  if(!text) return;
  const day=getDay(currentUserId,todayKey(),true);
  const meal=getMeal(day,mealKey,true);
  const res=checkFood(mealKey,text,{
    cheat:isFriday(),
    late: mealKey==='dinner' && after19(),
    eventLunch: !!day.event,
  });
  meal.items.push({id:uid(), text, ts:Date.now(), status:res.status, why:res.why});
  queueSync(); render();
}
function delItem(mealKey,id){
  const day=getDay(currentUserId,todayKey(),true);
  const meal=getMeal(day,mealKey,true);
  const it=(meal.items||[]).find(i=>i.id===id);
  if(it){ it.del=true; it.ts=Date.now(); }
  queueSync(); render();
}
function setWater(mealKey,n){
  const day=getDay(currentUserId,todayKey(),true);
  const meal=getMeal(day,mealKey,true);
  meal.water=n; meal.waterTs=Date.now();
  queueSync(); render();
}

function saveWeight(){
  const v=parseFloat(document.getElementById('wkg').value);
  if(!v || v<=0 || v>250){ alert('נא להזין משקל תקין בק״ג'); return; }
  DATA.weights[currentUserId]=DATA.weights[currentUserId]||{};
  DATA.weights[currentUserId][weekKey()]={kg:v, date:todayKey(), ts:Date.now()};
  queueSync(); render();
}
function weightChart(list){
  const pts=list.slice(-10);
  if(pts.length<2) return '<p class="muted">אחרי עוד שקילה יופיע כאן גרף 📈</p>';
  const kgs=pts.map(p=>p.kg);
  const min=Math.min(...kgs), max=Math.max(...kgs);
  const pad=(max-min)*0.2||1;
  const lo=min-pad, hi=max+pad;
  const W=300,H=120;
  const xy=pts.map((p,i)=>{
    const x=10+(W-20)*i/(pts.length-1);
    const y=H-10-(H-20)*((p.kg-lo)/(hi-lo));
    return [x,y];
  });
  const line=xy.map(p=>p.join(',')).join(' ');
  const dots=xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#16a34a"/><text x="${p[0]}" y="${p[1]-8}" font-size="9" text-anchor="middle" fill="#166534" font-weight="700">${pts[i].kg}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><polyline points="${line}" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}

      <h3 style="margin-bottom:8px">🔗 חיבור מכשירים</h3>
      <p class="muted" style="margin-bottom:10px">שולחים לכל ילד את הקישור — הוא נכנס, בוחר את השם שלו ומקליד את הקוד האישי שלו:</p>
      <input readonly value="${shareLink}" style="direction:ltr;font-size:12px" onclick="this.select()" />
      <div class="row" style="margin-top:10px">
        <a class="btn small block" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent('הצטרפו ליומן האוכל המשפחתי שלנו! 🥗\n'+shareLink)}" target="_blank">📲 שיתוף בוואטסאפ</a>
        <button class="btn small secondary" onclick="copyLink('${shareLink}')">העתקה</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">🔑 קוד הורה</h3>
      <p class="muted">הקוד הנוכחי: <span class="codechip">${DATA.parent.code}</span></p>
      <button class="btn small secondary" style="margin-top:8px" onclick="resetParentCode()">איפוס קוד הורה</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">📜 החוקים</h3>
      ${RULES.map(r=>`<div class="rule"><span class="ic">${r[0]}</span><span>${r[1]}</span></div>`).join('')}
    </div>
  </div>`;
}
function toggleKid(id){ openKid = openKid===id?null:id; render(); }
const KID_EMOJIS=['🦁','🐯','🐼','🦊','🐸','🦄','🐬','🦋','🐢','🦖'];
function addKid(){
  const name=document.getElementById('newKidName').value.trim();
  if(!name) return;
  const code=randCode();
  DATA.kids.push({id:uid(), name, code, codeTs:Date.now(), emoji:KID_EMOJIS[DATA.kids.length%KID_EMOJIS.length]});
  queueSync(); render();
  alert('נוסף! 🎉 הקוד של '+name+' הוא: '+code);
}
function resetKidCode(id){
  const k=kidById(id); if(!k) return;
  const c=prompt('קוד חדש (4 ספרות) עבור '+k.name+':', randCode());
  if(c===null) return;
  if(!/^\d{4}$/.test(c)){ alert('הקוד חייב להיות 4 ספרות'); return; }
  k.code=c; k.codeTs=Date.now();
  queueSync(); render();
  alert('הקוד של '+k.name+' אופס ל־'+c);
}
function removeKid(id){
  const k=kidById(id); if(!k) return;
  if(!confirm('להסיר את '+k.name+' מהיומן?')) return;
  DATA.kids=DATA.kids.filter(x=>x.id!==id);
  DATA.removedKids=[...(DATA.removedKids||[]), id];
  queueSync(); render();
}
function resetParentCode(){
  const c=prompt('קוד הורה חדש (4 ספרות):', randCode());
  if(c===null) return;
  if(!/^\d{4}$/.test(c)){ alert('הקוד חייב להיות 4 ספרות'); return; }
  DATA.parent.code=c; DATA.parent.codeTs=Date.now();
  queueSync(); render();
  alert('קוד ההורה אופס ל־'+c);
}
function copyLink(l){
  navigator.clipboard?.writeText(l).then(()=>alert('הקישור הועתק! 📋')).catch(()=>{});
}

/* ---------- אתחול ---------- */
(function init(){
  const m=location.hash.match(/family=([A-Za-z0-9]+)/);
  if(m && m[1] && m[1]!==familyId){
    familyId=m[1];
    localStorage.setItem('fam.id',familyId);
    currentUserId=null; localStorage.removeItem('fam.user');
    localStorage.removeItem('fam.cache'); DATA=null;
    history.replaceState(null,'',location.pathname);
  }
  const cache=localStorage.getItem('fam.cache');
  if(cache && !DATA){ try{ DATA=JSON.parse(cache); }catch(e){} }
  render();
  if(familyId){
    startPolling();
    syncNow();
  }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && familyId) syncNow(); });
})();
</script>
</body>
</html>
